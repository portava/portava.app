[package]
name = "mls-spike"
version = "0.1.0"
edition = "2021"

[dependencies]
openmls = "0.6.0"
openmls_rust_crypto = "0.3.0"
openmls_basic_credential = "0.3.0"
openmls_traits = "0.3.0"
# SPIKE FINDING: serialize/deserialize on MemoryStorage are behind `test-utils`.
openmls_memory_storage = { version = "0.3.0", features = ["test-utils"] }
tls_codec = "0.4"
base64 = "0.22.1"
