openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /healthz/cleanup:
    get:
      operationId: cleanupHealthCheck
      tags: [health]
      summary: Cleanup health check
      description: Returns the outcome of the most recent daily-briefs purge run so uptime monitors can alert on stale or failed runs.
      responses:
        "200":
          description: Cleanup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanupStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CleanupStatus:
      type: object
      properties:
        cleanupStatus:
          type: string
          enum: [ok, overdue, critical]
          description: "'ok' when the job last ran within the expected window (interval + 1 h grace), 'overdue' when slightly late (up to 2× interval), 'critical' when significantly late (≥ 2× interval) or never run."
        lastRunAt:
          type: string
          nullable: true
          description: ISO-8601 timestamp of the most recent purge attempt (from persistent storage), or null if no run has occurred yet.
        lastOutcome:
          type: string
          nullable: true
          enum: [success, error, skipped, null]
          description: Outcome of the most recent purge attempt.
        lastDeletedCount:
          type: integer
          nullable: true
          description: Number of rows deleted in the most recent successful purge, or null on error/skip.
        consecutiveFailures:
          type: integer
          description: Number of consecutive failed purge attempts since the last success. Non-zero values should trigger an alert.
      required:
        - cleanupStatus
        - lastRunAt
        - lastOutcome
        - lastDeletedCount
        - consecutiveFailures
