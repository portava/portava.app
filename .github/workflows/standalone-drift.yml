name: Standalone drift check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check-source-drift:
    name: Check standalone source drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run standalone drift check
        run: bash scripts/sync-standalone.sh --check-source
