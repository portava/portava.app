# beta-db.yml — build the NEW, EMPTY portava-beta Supabase project from the
# repo's schema truth. workflow_dispatch ONLY, behind a typed confirmation.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT IT BUILDS, AND FROM WHAT
# ─────────────────────────────────────────────────────────────────────────────
# Target: portava-beta, ref emfpckykpzfturllshly, https://emfpckykpzfturllshly.supabase.co
# (created 2026-10-06 on the owner's authorization; empty; Postgres 17).
#
#   1. reference-snapshot  READ-ONLY against portava-ci (hwokxgbmezheskbzskfr).
#      scripts/src/beta-reference-snapshot.ts SELECTs the allowlisted reference
#      tables whose rows migrations sorting before 2093_ seeded and the
#      structure-only baseline therefore lacks, with user-id columns NULLed and
#      every feature flag forced off. Uploaded as an artifact.
#   2. beta-bootstrap      WRITES portava-beta, in this order:
#        db:beta-bootstrap  — emptiness check, extensions, the 2026-08-19
#                             baseline (5,066 of its 5,200 statements; the
#                             skipped ones are printed by rule), a census of the
#                             result, the reference rows, and the migration
#                             ledger pre-created with a 'backfill' row for each
#                             of the 280 files the baseline already covers;
#        db:apply-migrations:dry-run, db:apply-migrations
#                           — the UNCHANGED applier, which now sees every file
#                             at or after 2093_ as pending. It refuses two files
#                             by shape (2182, 2190: transaction control it cannot
#                             wrap with a ledger row). The apply step is a
#                             bounded loop: where the applier stops on one, the
#                             bootstrap applies it verbatim and records it
#                             applied_by='manual' (db:beta-bootstrap
#                             --apply-refused), and the applier resumes;
#        certify:migrations, audit:schema
#                           — the same proofs live-db.yml runs on portava-ci.
#   3. verdict             .github/scripts/live-db-verdict.sh, as everywhere.
#
# The chain apply also needs PR #632 (declared apply-order overrides) merged
# first; see the runbook.
#
# Runbook: docs/supabase-beta-runbook.md. Dispatch:
#   gh workflow run beta-db.yml -f confirm=BOOTSTRAP-BETA
#   gh workflow run beta-db.yml -f confirm=BOOTSTRAP-BETA -f reset=RESET-BETA
#   gh workflow run beta-db.yml -f confirm=APPLY-PENDING-BETA              # dry run (default)
#   gh workflow run beta-db.yml -f confirm=APPLY-PENDING-BETA -f apply=yes # writes
#
# ─────────────────────────────────────────────────────────────────────────────
# THE APPLY-PENDING MODE (confirm=APPLY-PENDING-BETA; lead ruling, 2026-10-07)
# ─────────────────────────────────────────────────────────────────────────────
# After the bootstrap, migrations merged to main reach beta here, without a
# reset, so testers' data survives. Job `beta-apply-pending`:
#   * NEVER resets and never runs the bootstrap: no emptiness check, no
#     baseline, no reference import. `reset` must be empty (preflight refuses
#     otherwise). The only db:beta-bootstrap modes it calls are --check-refused
#     (offline) and --apply-refused (one refused-by-shape file, in order).
#   * Applies ONLY the chain files beta does not have: the UNCHANGED applier,
#     which reads beta's own ledger and applies the pending files in the
#     ORDER_OVERRIDES order, each atomically with its ledger row. An unbuilt
#     beta (no ledger) makes the applier exit 2: refused, nothing written.
#   * The same refusals as the bootstrap: the dry run's refused-by-shape files
#     must be in the bootstrap's computed set, and only those are hand-applied.
#   * DRY RUN BY DEFAULT: without apply=yes it runs the dry run (the pending
#     list and any refusal) and writes nothing. With apply=yes it applies, then
#     certify:migrations and audit:schema, as the bootstrap does.
# After a writing run, re-dispatch beta-config.yml: new flags are seeded by
# their migrations and the policy decides them (beta:provision does both).
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY THE BETA JOB USES THE ci-nonprod-supabase ENVIRONMENT, AND ONLY ITS TOKEN
# ─────────────────────────────────────────────────────────────────────────────
# The Supabase Management API token in that environment is an ACCOUNT-level
# token (sbp_ prefix; enumerating /v1/projects with it on 2026-08-11 returned
# every project of the org — see .github/scripts/assert-nonprod-supabase.sh). A
# token like that constrains nothing about WHICH project is reached, so it is
# not what binds this job to beta and it never was for any job in this repo.
# The target is bound by the allowlist and by code:
#   * SUPABASE_URL and CI_SUPABASE_PROJECT_REF are LITERALS in the beta job,
#     both naming emfpckykpzfturllshly. They are not secrets and they must be
#     visible in review: a reviewer of this file can see exactly which project
#     the job writes to.
#   * assert-nonprod-supabase.sh (the step below, a fail-fast duplicate) and
#     ciSupabaseGuard.mjs (the in-process guard every entry point imports
#     first) refuse anything but that ref, and production always.
#   * beta-bootstrap.ts additionally HARD-CODES the beta ref and exits 2 for
#     any other — including portava-ci — because it restores a baseline over
#     whatever it finds.
# The job therefore references exactly ONE secret: BETA_SUPABASE_PROJECT_TOKEN
# (mapped into SUPABASE_PROJECT_TOKEN, the name every script reads). It
# does not read secrets.SUPABASE_URL (that is portava-ci's URL), nor the
# service-role or anon keys, which belong to portava-ci and mean nothing to
# beta.
#
# IF THE TOKEN TURNS OUT TO BE PROJECT-SCOPED, the beta job fails with a 401 or
# 403 from the Management API on its first query (the script says so in its
# error). That is an external prerequisite to report — an account-level token,
# or a beta-scoped one in its own environment — and NOT something to work
# around here.
#
# ─────────────────────────────────────────────────────────────────────────────
# NOT live-db.yml's SHARED SLOT, ON PURPOSE
# ─────────────────────────────────────────────────────────────────────────────
# live-db.yml serializes runs against portava-ci with
# .github/scripts/live-db-acquire-slot.sh. portava-beta is a DIFFERENT database:
# the beta job must never take that slot (it would starve portava-ci's
# certification for the length of a full chain apply for no reason). The
# reference-snapshot job does touch portava-ci, but only with SELECTs inside
# READ ONLY transactions; if it overlaps an in-flight apply on portava-ci it can
# read a half-applied table and the bootstrap's validation or import will say
# so loudly — re-dispatch. Serialization against itself is the `concurrency`
# group below, never cancelling: a reset must not be interrupted between its
# DROP and the rebuild.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE PREFLIGHT AUTHORITY'S KNOWN GAP, STATED (same note as clean-build-proof.yml)
# ─────────────────────────────────────────────────────────────────────────────
# .github/scripts/assert-ci-scripts.mjs checks REQUIRED_CREDENTIAL_JOBS against
# live-db.yml only, so the two credential jobs here are outside that
# DECLARATION. They are inside both mechanisms that actually hold the line: the
# in-process guard every entry point imports first, and the unconditional
# allowlist step in each job (which ci.yml's self-check requires to carry no
# `if:`). The preflight job below still asserts every (package, script) triple
# this file names, and that no selector form or Supabase CLI appears in it.
#
# Also not here, matching live-db.yml: no `if: secrets.X != ''` (a missing
# secret must be red, not a grey skip), and no pnpm workspace-selector form
# (it exits 0 having run nothing) — every package script goes through
# .github/scripts/pnpm-run.sh.

name: Beta DB bootstrap (portava-beta)
# The mode and the write are in the run's title, so `gh run list` (and
# scripts/src/beta-owner.ts) can tell a bootstrap, a dry run and an applying run apart.
run-name: "beta-db · ${{ inputs.confirm }}${{ inputs.apply == 'yes' && ' · apply' || '' }}${{ inputs.reset == 'RESET-BETA' && ' · reset' || '' }}"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          BOOTSTRAP-BETA builds portava-beta (emfpckykpzfturllshly) from the
          baseline, the portava-ci reference snapshot and the migration chain.
          APPLY-PENDING-BETA applies only the chain files a built beta lacks
          (never resets; a dry run unless apply=yes). Type exactly one.
        required: true
        type: string
      reset:
        description: >-
          Optional and DESTRUCTIVE: drop and recreate schema public on
          portava-beta first (refused anyway if anyone has signed in). Leave
          empty, or type exactly: RESET-BETA
        required: false
        default: ''
        type: string
      apply:
        description: >-
          APPLY-PENDING-BETA only: leave empty for a dry run (the default; writes
          nothing), or type exactly yes to apply the pending files.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: beta-db
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  # SECONDARY, as in live-db.yml: the allowlist already refuses this ref along
  # with every unsanctioned one; this catches the allowlist being pointed at
  # production. If production moves, every workflow carrying it changes.
  KNOWN_PROD_PROJECT_REF: 'ajrurzioarfkagpuxfnb'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Credential-free: every CI-invoked (package, script) exists, and the
  # dispatch inputs are exactly what they must be. A typo in `reset` is a
  # refusal, never a quiet run without the reset.
  # ───────────────────────────────────────────────────────────────────────────
  preflight:
    name: preflight · every CI-invoked package script exists + exact dispatch inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Assert every CI-invoked (package, script) pair exists
        shell: bash
        run: node .github/scripts/assert-ci-scripts.mjs
      - name: Dispatch inputs must be exact
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          RESET: ${{ inputs.reset }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -uo pipefail
          case "$CONFIRM" in
            BOOTSTRAP-BETA)
              if [ -n "$APPLY" ]; then
                echo "::error::apply belongs to confirm=APPLY-PENDING-BETA; the bootstrap always applies. Leave apply empty. Nothing was run."
                exit 1
              fi ;;
            APPLY-PENDING-BETA)
              if [ -n "$RESET" ]; then
                echo "::error::APPLY-PENDING-BETA never resets: leave reset empty. A rebuild is confirm=BOOTSTRAP-BETA with reset=RESET-BETA. Nothing was run."
                exit 1
              fi
              case "$APPLY" in
                "")  echo "apply-pending: DRY RUN — the pending list and any refusal are printed; nothing is written." ;;
                yes) echo "::warning::apply-pending: APPLYING the chain files portava-beta does not have (no reset)." ;;
                *)   echo "::error::The apply input must be empty or exactly yes. Refusing rather than guessing. Nothing was run."
                     exit 1 ;;
              esac
              exit 0 ;;
            *)
              echo "::error::The confirm input must be exactly BOOTSTRAP-BETA or APPLY-PENDING-BETA. Nothing was run."
              exit 1 ;;
          esac
          case "$RESET" in
            "")
              echo "reset: not requested — the bootstrap refuses a non-empty public schema." ;;
            RESET-BETA)
              echo "::warning::reset: REQUESTED — schema public on portava-beta will be dropped and rebuilt." ;;
            *)
              echo "::error::The reset input must be empty or exactly RESET-BETA. Refusing rather than running without the reset that was evidently intended."
              exit 1 ;;
          esac

  # ───────────────────────────────────────────────────────────────────────────
  # READ-ONLY against portava-ci. The usual credential-job shape, unchanged.
  # ───────────────────────────────────────────────────────────────────────────
  reference-snapshot:
    name: beta · reference snapshot from portava-ci (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    if: ${{ inputs.confirm == 'BOOTSTRAP-BETA' }}
    environment: ci-nonprod-supabase
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PROJECT_TOKEN: ${{ secrets.SUPABASE_PROJECT_TOKEN }}
      CI_SUPABASE_PROJECT_REF: ${{ vars.CI_SUPABASE_PROJECT_REF || secrets.CI_SUPABASE_PROJECT_REF }}
    steps:
      - name: Preflight — required secrets must be non-empty
        shell: bash
        run: |
          set -uo pipefail
          MISSING=0
          for NAME in SUPABASE_URL SUPABASE_PROJECT_TOKEN; do
            if [ -z "${!NAME:-}" ]; then
              echo "::error::Required secret $NAME is empty or not configured. This job fails rather than skips. See docs/ci/README.md."
              MISSING=1
            else
              echo "OK: $NAME is set (value not printed)."
            fi
          done
          if [ "$MISSING" -ne 0 ]; then exit 1; fi

      - uses: actions/checkout@v4

      # ALLOWLIST. A fail-fast duplicate of the in-process guard that
      # beta-reference-snapshot.ts imports first; see docs/ci/README.md
      # § "The allowlist is enforced in the execution path".
      - name: Preflight — Supabase target must be the sanctioned CI project
        shell: bash
        run: bash .github/scripts/assert-nonprod-supabase.sh

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          echo "pnpm $(pnpm --version)"
          node --version

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          set -euo pipefail
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-root-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-root-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install (root workspace, frozen lockfile)
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      # SELECTs only, each inside SET TRANSACTION READ ONLY; allowlisted tables
      # only; user-id columns NULL; feature_flags.enabled = false on every row.
      - name: 'db:beta-reference-snapshot — read the reference rows from portava-ci'
        shell: bash
        run: bash .github/scripts/pnpm-run.sh scripts @workspace/scripts db:beta-reference-snapshot --out "$RUNNER_TEMP/beta-snapshot/beta-reference-snapshot.json"

      - uses: actions/upload-artifact@v4
        with:
          name: beta-reference-snapshot
          path: ${{ runner.temp }}/beta-snapshot/beta-reference-snapshot.json
          if-no-files-found: error
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # WRITES portava-beta. Literal target, one secret (the token). See the header.
  # Steps run strictly in order with the default success() condition: nothing
  # here runs after a failed step, because every step assumes the one before it
  # completed — the applier on top of a half-restored baseline would invent a
  # schema no environment has had.
  # ───────────────────────────────────────────────────────────────────────────
  beta-bootstrap:
    name: beta · bootstrap portava-beta, apply the chain, certify, audit
    runs-on: ubuntu-latest
    timeout-minutes: 150
    needs: [preflight, reference-snapshot]
    if: ${{ inputs.confirm == 'BOOTSTRAP-BETA' }}
    environment: ci-nonprod-supabase
    env:
      SUPABASE_URL: 'https://emfpckykpzfturllshly.supabase.co'
      CI_SUPABASE_PROJECT_REF: 'emfpckykpzfturllshly'
      # The BETA token, mapped into the one name the scripts read. It is a
      # SEPARATE secret from the CI job's: SUPABASE_PROJECT_TOKEN is project-scoped
      # to portava-ci (docs/ci/README.md § "Setting up the non-production
      # project" prescribes that), and the first dispatch on 2026-10-06 measured
      # the consequence — the Management API answered 403 on beta's first query
      # and nothing was written. The beta project gets its own token, scoped to
      # it, so the CI token is never widened.
      SUPABASE_PROJECT_TOKEN: ${{ secrets.BETA_SUPABASE_PROJECT_TOKEN }}
    steps:
      - name: Preflight — required secrets must be non-empty
        shell: bash
        run: |
          set -uo pipefail
          MISSING=0
          for NAME in SUPABASE_URL SUPABASE_PROJECT_TOKEN; do
            if [ -z "${!NAME:-}" ]; then
              echo "::error::Required value $NAME is empty or not configured. In this job SUPABASE_PROJECT_TOKEN is mapped from the environment secret BETA_SUPABASE_PROJECT_TOKEN — a Management API token scoped to portava-beta (emfpckykpzfturllshly); create it in the Supabase dashboard and add it to the ci-nonprod-supabase environment. This job fails rather than skips. See docs/ci/README.md."
              MISSING=1
            else
              echo "OK: $NAME is set (value not printed)."
            fi
          done
          if [ "$MISSING" -ne 0 ]; then exit 1; fi

      - uses: actions/checkout@v4

      # The same allowlist, sanctioning portava-beta for THIS job only, by the
      # literal CI_SUPABASE_PROJECT_REF above. Production is refused by the
      # secondary assertion whatever that literal says.
      - name: Preflight — Supabase target must be the sanctioned project (portava-beta in this job)
        shell: bash
        run: bash .github/scripts/assert-nonprod-supabase.sh

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          echo "pnpm $(pnpm --version)"
          node --version

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          set -euo pipefail
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-root-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-root-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install (root workspace, frozen lockfile)
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: beta-reference-snapshot
          path: ${{ runner.temp }}/beta-snapshot

      # a–h of scripts/src/beta-bootstrap.ts. Exit 2 = refused (wrong target,
      # not empty, bad snapshot), 1 = a statement / census / import failed and
      # the log names it, 0 = ready for the applier.
      - name: 'db:beta-bootstrap — baseline, reference rows, ledger'
        shell: bash
        env:
          BETA_RESET: ${{ inputs.reset }}
        run: |
          set -euo pipefail
          SNAPSHOT="$RUNNER_TEMP/beta-snapshot/beta-reference-snapshot.json"
          if [ "$BETA_RESET" = "RESET-BETA" ]; then
            bash .github/scripts/pnpm-run.sh scripts @workspace/scripts db:beta-bootstrap --snapshot "$SNAPSHOT" --reset --confirm-reset=RESET-BETA
          else
            bash .github/scripts/pnpm-run.sh scripts @workspace/scripts db:beta-bootstrap --snapshot "$SNAPSHOT"
          fi

      # THE UNCHANGED APPLIER'S DRY RUN. With the ledger pre-created every
      # canonical file at or after 2093_ is pending, so it classifies all of
      # them. It exits 1 when a pending file is refused by SHAPE (transaction
      # control it cannot wrap with its ledger row: 2182 and 2190 today). That
      # exit is accepted ONLY when every refused file it names is in the
      # bootstrap's own computed refused set (--check-refused, offline); the
      # list is kept for the apply loop below. Any other failure is red.
      - name: 'migrations — dry run (refusals must be exactly the files the bootstrap hand-applies)'
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/apply-dry-run.log"
          REFUSED_LIST="$RUNNER_TEMP/refused-by-shape.txt"
          bash .github/scripts/pnpm-run.sh scripts @workspace/scripts db:apply-migrations:dry-run 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          sed -nE 's/^ +[0-9]+\. ([A-Za-z0-9_.-]+\.sql) +\[REFUSED .*/\1/p' "$LOG" > "$REFUSED_LIST"
          if [ "$RC" -eq 0 ]; then
            echo "dry run: no pending file is refused by shape."
            exit 0
          fi
          if [ "$RC" -ne 1 ] || [ ! -s "$REFUSED_LIST" ]; then
            echo "::error::the dry run failed (exit $RC) for a reason other than files refused by shape — see above."
            exit 1
          fi
          echo "dry run: refused by shape, to be applied verbatim by the bootstrap: $(paste -sd, "$REFUSED_LIST")"
          bash .github/scripts/pnpm-run.sh scripts @workspace/scripts db:beta-bootstrap --check-refused "$(paste -sd, "$REFUSED_LIST")"

      # THE APPLY, AS A BOUNDED LOOP. The applier stops at the first refused
      # file, having applied everything before it; the bootstrap then applies
      # that file VERBATIM and records it applied_by='manual' (the applier's own
      # documented remedy — see scripts/src/beta-bootstrap.ts), and the applier
      # runs again from there. Today: applier (stops at 2182) -> hand-apply 2182
      # -> applier (stops at 2190) -> hand-apply 2190 -> applier (to the end).
      # The loop continues ONLY on a stop the applier reports as `refused`, for
      # a file the dry run listed; any other failure ends it red. At most
      # (number of refused files + 1) applier runs.
      - name: 'migrations — apply the chain, hand-applying each refused-by-shape file where the applier stops'
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/apply.log"
          REFUSED_LIST="$RUNNER_TEMP/refused-by-shape.txt"
          CAP=$(( $(grep -c . "$REFUSED_LIST") + 1 ))
          RUN=0
          while [ "$RUN" -lt "$CAP" ]; do
            RUN=$((RUN + 1))
            echo "── applier run $RUN of at most $CAP"
            bash .github/scripts/pnpm-run.sh scripts @workspace/scripts db:apply-migrations 2>&1 | tee "$LOG"
            RC=${PIPESTATUS[0]}
            if [ "$RC" -eq 0 ]; then
              echo "applier: the chain is complete after $RUN run(s)."
              exit 0
            fi
            STOPPED="$(sed -nE 's/.*apply-migrations STOPPED at ([A-Za-z0-9_.-]+\.sql) \(refused\).*/\1/p' "$LOG" | head -n 1)"
            if [ "$RC" -ne 1 ] || [ -z "$STOPPED" ]; then
              echo "::error::the applier failed (exit $RC) for a reason other than a file refused by shape. Only refused files are hand-applied; this is a real failure — see above."
              exit 1
            fi
            if ! grep -qxF "$STOPPED" "$REFUSED_LIST"; then
              echo "::error::the applier refused $STOPPED, which this run's dry run did not list. Not hand-applying a file nobody saw refused."
              exit 1
            fi
            echo "── hand-applying $STOPPED verbatim (the applier refuses its shape)"
            if ! bash .github/scripts/pnpm-run.sh scripts @workspace/scripts db:beta-bootstrap --apply-refused "$STOPPED"; then
              echo "::error::the bootstrap could not hand-apply $STOPPED — see above."
              exit 1
            fi
          done
          echo "::error::the applier had not finished after $CAP run(s) — more stops than refused files. Stopping."
          exit 1

      - name: 'migrations — certify the apply landed'
        shell: bash
        run: bash .github/scripts/pnpm-run.sh artifacts/api-server @workspace/api-server certify:migrations

      - name: 'audit:schema — migrations vs the live beta schema'
        shell: bash
        run: bash .github/scripts/pnpm-run.sh artifacts/api-server @workspace/api-server audit:schema

  # ───────────────────────────────────────────────────────────────────────────
  # APPLY-PENDING. Only the chain files a BUILT beta lacks; never a reset; a
  # dry run unless apply=yes. See the header.
  # ───────────────────────────────────────────────────────────────────────────
  beta-apply-pending:
    name: beta · apply pending migrations (no reset; dry run unless apply=yes)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: preflight
    if: ${{ inputs.confirm == 'APPLY-PENDING-BETA' }}
    environment: ci-nonprod-supabase
    env:
      SUPABASE_URL: 'https://emfpckykpzfturllshly.supabase.co'
      CI_SUPABASE_PROJECT_REF: 'emfpckykpzfturllshly'
      SUPABASE_PROJECT_TOKEN: ${{ secrets.BETA_SUPABASE_PROJECT_TOKEN }}
    steps:
      - name: Preflight — required secrets must be non-empty
        shell: bash
        run: |
          set -uo pipefail
          MISSING=0
          for NAME in SUPABASE_URL SUPABASE_PROJECT_TOKEN; do
            if [ -z "${!NAME:-}" ]; then
              echo "::error::Required value $NAME is empty or not configured. In this job SUPABASE_PROJECT_TOKEN is mapped from the environment secret BETA_SUPABASE_PROJECT_TOKEN — a Management API token scoped to portava-beta (emfpckykpzfturllshly). This job fails rather than skips."
              MISSING=1
            else
              echo "OK: $NAME is set (value not printed)."
            fi
          done
          if [ "$MISSING" -ne 0 ]; then exit 1; fi

      - uses: actions/checkout@v4

      - name: Preflight — Supabase target must be the sanctioned project (portava-beta in this job)
        shell: bash
        run: bash .github/scripts/assert-nonprod-supabase.sh

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          echo "pnpm $(pnpm --version)"
          node --version

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          set -euo pipefail
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-root-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-root-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install (root workspace, frozen lockfile)
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      # ALWAYS, write or not: the unchanged applier's dry run against beta's own
      # ledger lists exactly the files beta lacks, in the overridden order. An
      # unbuilt beta (no ledger table) exits 2 here — refused, nothing written.
      # Refusals by shape are accepted only for files in the bootstrap's
      # computed refused set, exactly as in the bootstrap job.
      - name: 'apply-pending — dry run (what beta lacks; refusals must be the computed set)'
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/apply-dry-run.log"
          REFUSED_LIST="$RUNNER_TEMP/refused-by-shape.txt"
          bash .github/scripts/pnpm-run.sh scripts @workspace/scripts db:apply-migrations:dry-run 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          sed -nE 's/^ +[0-9]+\. ([A-Za-z0-9_.-]+\.sql) +\[REFUSED .*/\1/p' "$LOG" > "$REFUSED_LIST"
          if [ "$RC" -eq 0 ]; then
            echo "dry run: no pending file is refused by shape."
            exit 0
          fi
          if [ "$RC" -eq 2 ]; then
            echo "::error::the applier refused before reading the chain (exit 2) — most likely beta has no migration ledger because it was never bootstrapped. Dispatch confirm=BOOTSTRAP-BETA first. Nothing was written."
            exit 1
          fi
          if [ "$RC" -ne 1 ] || [ ! -s "$REFUSED_LIST" ]; then
            echo "::error::the dry run failed (exit $RC) for a reason other than files refused by shape — see above."
            exit 1
          fi
          echo "dry run: refused by shape, to be applied verbatim: $(paste -sd, "$REFUSED_LIST")"
          bash .github/scripts/pnpm-run.sh scripts @workspace/scripts db:beta-bootstrap --check-refused "$(paste -sd, "$REFUSED_LIST")"

      - name: 'apply-pending — DRY RUN: nothing was written'
        if: ${{ inputs.apply != 'yes' }}
        shell: bash
        run: echo "Dry run only. To apply the files listed above, dispatch again with apply=yes."

      # The bootstrap job's bounded loop, unchanged: the applier stops at a
      # refused-by-shape file the dry run listed, the bootstrap hand-applies that
      # one file (in order, recorded applied_by='manual'), the applier resumes.
      - name: 'apply-pending — apply what beta lacks (refused-by-shape files hand-applied where the applier stops)'
        if: ${{ inputs.apply == 'yes' }}
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/apply.log"
          REFUSED_LIST="$RUNNER_TEMP/refused-by-shape.txt"
          CAP=$(( $(grep -c . "$REFUSED_LIST") + 1 ))
          RUN=0
          while [ "$RUN" -lt "$CAP" ]; do
            RUN=$((RUN + 1))
            echo "── applier run $RUN of at most $CAP"
            bash .github/scripts/pnpm-run.sh scripts @workspace/scripts db:apply-migrations 2>&1 | tee "$LOG"
            RC=${PIPESTATUS[0]}
            if [ "$RC" -eq 0 ]; then
              echo "applier: beta has every chain file after $RUN run(s)."
              exit 0
            fi
            STOPPED="$(sed -nE 's/.*apply-migrations STOPPED at ([A-Za-z0-9_.-]+\.sql) \(refused\).*/\1/p' "$LOG" | head -n 1)"
            if [ "$RC" -ne 1 ] || [ -z "$STOPPED" ]; then
              echo "::error::the applier failed (exit $RC) for a reason other than a file refused by shape. Only refused files are hand-applied; this is a real failure — see above."
              exit 1
            fi
            if ! grep -qxF "$STOPPED" "$REFUSED_LIST"; then
              echo "::error::the applier refused $STOPPED, which this run's dry run did not list. Not hand-applying a file nobody saw refused."
              exit 1
            fi
            echo "── hand-applying $STOPPED verbatim (the applier refuses its shape)"
            if ! bash .github/scripts/pnpm-run.sh scripts @workspace/scripts db:beta-bootstrap --apply-refused "$STOPPED"; then
              echo "::error::the bootstrap could not hand-apply $STOPPED — see above."
              exit 1
            fi
          done
          echo "::error::the applier had not finished after $CAP run(s) — more stops than refused files. Stopping."
          exit 1

      - name: 'apply-pending — certify the apply landed'
        if: ${{ inputs.apply == 'yes' }}
        shell: bash
        run: bash .github/scripts/pnpm-run.sh artifacts/api-server @workspace/api-server certify:migrations

      - name: 'apply-pending — audit:schema (migrations vs the live beta schema)'
        if: ${{ inputs.apply == 'yes' }}
        shell: bash
        run: bash .github/scripts/pnpm-run.sh artifacts/api-server @workspace/api-server audit:schema

  # ───────────────────────────────────────────────────────────────────────────
  # THE VERDICT. A cancelled, skipped or failed job must not read as a pass.
  # Each mode is judged on its OWN jobs: the other mode's jobs are skipped by
  # design and are not passed to the classifier.
  # ───────────────────────────────────────────────────────────────────────────
  verdict:
    name: beta · verdict (skipped or cancelled is not a pass)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - preflight
      - reference-snapshot
      - beta-bootstrap
      - beta-apply-pending
    steps:
      - uses: actions/checkout@v4
      - name: Classify the run — PASS / FAIL / NOT EXECUTED
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SNAPSHOT_RESULT: ${{ needs['reference-snapshot'].result }}
          BOOTSTRAP_RESULT: ${{ needs['beta-bootstrap'].result }}
          APPLY_PENDING_RESULT: ${{ needs['beta-apply-pending'].result }}
        run: |
          set -uo pipefail
          if [ "$CONFIRM" = "APPLY-PENDING-BETA" ]; then
            bash .github/scripts/live-db-verdict.sh "preflight=${PREFLIGHT_RESULT}" "beta-apply-pending=${APPLY_PENDING_RESULT}"
          else
            bash .github/scripts/live-db-verdict.sh "preflight=${PREFLIGHT_RESULT}" "reference-snapshot=${SNAPSHOT_RESULT}" "beta-bootstrap=${BOOTSTRAP_RESULT}"
          fi
