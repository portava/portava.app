name: Credential health check

# Runs every Monday at 09:00 UTC so the team has advance warning of expiring
# Apple/Android credentials before they become a build-blocking emergency.
# Opens a GitHub issue when any credential is within 60 days of expiry;
# closes that issue automatically once credentials are healthy again.
#
# Required secrets:
#   EXPO_TOKEN  — EAS access token (same one used by the eas-build CI job)
#
# Required permissions (set at the job level below):
#   issues: write   — needed for gh issue create / gh issue close
#   contents: read  — needed for actions/checkout

on:
  schedule:
    - cron: '0 9 * * 1'   # Every Monday at 09:00 UTC
  workflow_dispatch:        # Allow manual runs for testing

jobs:
  credential-health:
    name: EAS credential expiry check (60-day window)
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install eas-cli
        run: npm install -g eas-cli

      - name: Verify EXPO_TOKEN is configured
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it in GitHub → Settings → Secrets and variables → Actions. See docs/eas-runbook.md → 'iOS credentials setup for CI'."
            exit 1
          fi

      # ── iOS credential check ────────────────────────────────────────────────
      - name: Check iOS EAS credentials (60-day window)
        working-directory: travel-buddy-standalone
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set +e
          eas credentials --platform ios --non-interactive --json \
            > /tmp/ios-creds.json 2>/tmp/ios-creds-err.txt
          EAS_EXIT=$?
          set -e

          if [ $EAS_EXIT -ne 0 ]; then
            echo "IOS_STATUS=error" >> "$GITHUB_ENV"
            echo "IOS_DETAIL=Could not retrieve iOS credentials from EAS cloud. Check that EXPO_TOKEN has access to this project. Run \`eas credentials --platform ios\` locally to diagnose." >> "$GITHUB_ENV"
            exit 0   # non-fatal here; summary step handles the issue
          fi

          node << 'NODESCRIPT'
          const fs = require('fs');

          let creds;
          try {
            const raw = fs.readFileSync('/tmp/ios-creds.json', 'utf8').trim();
            creds = JSON.parse(raw);
          } catch (e) {
            fs.appendFileSync(process.env.GITHUB_ENV, 'IOS_STATUS=error\n');
            fs.appendFileSync(process.env.GITHUB_ENV,
              'IOS_DETAIL=Could not parse JSON output from eas credentials --platform ios. Raw output may be empty or malformed.\n');
            process.exit(0);
          }

          const WARN_DAYS = 60;
          const now = Date.now();
          const msPerDay = 86400_000;
          const issues = [];

          function findExpiries(obj, path) {
            if (!obj || typeof obj !== 'object') return;
            for (const [k, v] of Object.entries(obj)) {
              const kl = k.toLowerCase();
              if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}/.test(v) &&
                  (kl.includes('expir') || kl.includes('notafter') || kl.includes('validity'))) {
                const ts = Date.parse(v);
                if (isNaN(ts)) continue;
                const daysLeft = (ts - now) / msPerDay;
                const loc = `${path}.${k}`;
                if (daysLeft <= 0) {
                  issues.push(`**EXPIRED** \`${loc}\` expired ${Math.abs(Math.floor(daysLeft))} day(s) ago (${v})`);
                } else if (daysLeft <= WARN_DAYS) {
                  issues.push(`**Expiring in ${Math.floor(daysLeft)} day(s)** \`${loc}\` (expires ${v})`);
                } else {
                  console.log(`iOS OK: ${loc} — ${Math.floor(daysLeft)} day(s) remaining`);
                }
              } else if (typeof v === 'object') {
                findExpiries(v, `${path}.${k}`);
              }
            }
          }

          const hasCert = creds.iosDistributionCertificate ||
                          creds.distributionCertificate ||
                          creds.distCert ||
                          (Array.isArray(creds) && creds.length > 0);
          if (!hasCert && typeof creds === 'object' && !Array.isArray(creds) &&
              Object.keys(creds).length === 0) {
            fs.appendFileSync(process.env.GITHUB_ENV, 'IOS_STATUS=error\n');
            fs.appendFileSync(process.env.GITHUB_ENV,
              'IOS_DETAIL=No iOS credentials found in EAS cloud. Run `eas credentials --platform ios` to create a Distribution Certificate and Provisioning Profile.\n');
            process.exit(0);
          }

          findExpiries(creds, 'ios');

          if (issues.length > 0) {
            fs.appendFileSync(process.env.GITHUB_ENV, 'IOS_STATUS=warn\n');
            fs.appendFileSync(process.env.GITHUB_ENV,
              `IOS_DETAIL=${issues.join(' | ')}\n`);
          } else {
            fs.appendFileSync(process.env.GITHUB_ENV, 'IOS_STATUS=ok\n');
          }
          NODESCRIPT

      # ── Android credential check ────────────────────────────────────────────
      - name: Check Android EAS credentials (60-day window)
        working-directory: travel-buddy-standalone
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set +e
          eas credentials --platform android --non-interactive --json \
            > /tmp/android-creds.json 2>/tmp/android-creds-err.txt
          EAS_EXIT=$?
          set -e

          if [ $EAS_EXIT -ne 0 ]; then
            echo "ANDROID_STATUS=error" >> "$GITHUB_ENV"
            echo "ANDROID_DETAIL=Could not retrieve Android credentials from EAS cloud. Check that EXPO_TOKEN has access to this project. Run \`eas credentials --platform android\` locally to diagnose." >> "$GITHUB_ENV"
            exit 0
          fi

          node << 'NODESCRIPT'
          const fs = require('fs');

          let creds;
          try {
            const raw = fs.readFileSync('/tmp/android-creds.json', 'utf8').trim();
            creds = JSON.parse(raw);
          } catch (e) {
            fs.appendFileSync(process.env.GITHUB_ENV, 'ANDROID_STATUS=error\n');
            fs.appendFileSync(process.env.GITHUB_ENV,
              'ANDROID_DETAIL=Could not parse JSON output from eas credentials --platform android.\n');
            process.exit(0);
          }

          const WARN_DAYS = 60;
          const now = Date.now();
          const msPerDay = 86400_000;
          const issues = [];

          function findExpiries(obj, path) {
            if (!obj || typeof obj !== 'object') return;
            for (const [k, v] of Object.entries(obj)) {
              const kl = k.toLowerCase();
              if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}/.test(v) &&
                  (kl.includes('expir') || kl.includes('notafter') || kl.includes('validity'))) {
                const ts = Date.parse(v);
                if (isNaN(ts)) continue;
                const daysLeft = (ts - now) / msPerDay;
                const loc = `${path}.${k}`;
                if (daysLeft <= 0) {
                  issues.push(`**EXPIRED** \`${loc}\` expired ${Math.abs(Math.floor(daysLeft))} day(s) ago (${v})`);
                } else if (daysLeft <= WARN_DAYS) {
                  issues.push(`**Expiring in ${Math.floor(daysLeft)} day(s)** \`${loc}\` (expires ${v})`);
                } else {
                  console.log(`Android OK: ${loc} — ${Math.floor(daysLeft)} day(s) remaining`);
                }
              } else if (typeof v === 'object') {
                findExpiries(v, `${path}.${k}`);
              }
            }
          }

          const hasKeystore = !!(
            (creds && !Array.isArray(creds) && (creds.keystore || creds.androidKeystore)) ||
            (Array.isArray(creds) && creds.length > 0 &&
              creds.some(p => p && (p.keystore || p.androidKeystore)))
          );
          if (!hasKeystore) {
            fs.appendFileSync(process.env.GITHUB_ENV, 'ANDROID_STATUS=error\n');
            fs.appendFileSync(process.env.GITHUB_ENV,
              'ANDROID_DETAIL=No Android keystore found in EAS cloud. Run `eas credentials --platform android` to create and upload a keystore.\n');
            process.exit(0);
          }

          findExpiries(creds, 'android');

          if (issues.length > 0) {
            fs.appendFileSync(process.env.GITHUB_ENV, 'ANDROID_STATUS=warn\n');
            fs.appendFileSync(process.env.GITHUB_ENV,
              `ANDROID_DETAIL=${issues.join(' | ')}\n`);
          } else {
            fs.appendFileSync(process.env.GITHUB_ENV, 'ANDROID_STATUS=ok\n');
          }
          NODESCRIPT

      # ── Issue management ─────────────────────────────────────────────────────
      - name: Open or close credential-health issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          IOS_STATUS="${IOS_STATUS:-ok}"
          ANDROID_STATUS="${ANDROID_STATUS:-ok}"

          # Build the label (create it if absent — gh is idempotent on existing labels)
          gh label create credential-health \
            --description "EAS credential expiry warning" \
            --color "e4e669" \
            --repo "$REPO" 2>/dev/null || true

          ISSUE_TITLE="[credential-health] EAS credentials expiring soon"

          # Find any open issue we previously opened
          EXISTING=$(gh issue list \
            --repo "$REPO" \
            --label credential-health \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ "$IOS_STATUS" = "ok" ] && [ "$ANDROID_STATUS" = "ok" ]; then
            echo "All credentials healthy."
            if [ -n "$EXISTING" ]; then
              echo "Closing stale credential-health issue #${EXISTING}."
              gh issue close "$EXISTING" \
                --repo "$REPO" \
                --comment "Credential health check passed — all credentials are healthy (more than 60 days until expiry). Closing automatically."
            else
              echo "No open credential-health issue to close."
            fi
          else
            # Build issue body
            BODY="## EAS credential health warning\n\n"
            BODY+="The weekly credential health check detected credentials that are expired, missing, or expiring within **60 days**.\n\n"
            BODY+="Rotate them **before the release build** to avoid a broken CI run under deadline pressure. See [docs/eas-runbook.md](../blob/main/docs/eas-runbook.md) for rotation steps.\n\n"

            if [ "$IOS_STATUS" != "ok" ]; then
              BODY+="### iOS\n\n"
              BODY+="- ${IOS_DETAIL}\n\n"
              BODY+="**Fix:** Run \`eas credentials --platform ios\` locally and follow the prompts (see *Rotating iOS credentials* in the runbook).\n\n"
            fi

            if [ "$ANDROID_STATUS" != "ok" ]; then
              BODY+="### Android\n\n"
              BODY+="- ${ANDROID_DETAIL}\n\n"
              BODY+="**Fix:** Run \`eas credentials --platform android\` locally and follow the prompts (see *Rotating Android keystore* in the runbook).\n\n"
            fi

            BODY+="---\n_This issue is opened automatically by the [credential-health workflow](../actions/workflows/credential-health.yml) and will close itself once the next weekly run finds all credentials healthy._"

            if [ -n "$EXISTING" ]; then
              echo "Updating existing credential-health issue #${EXISTING}."
              gh issue comment "$EXISTING" \
                --repo "$REPO" \
                --body "$(printf '%b' "$BODY")"
            else
              echo "Opening new credential-health issue."
              gh issue create \
                --repo "$REPO" \
                --title "$ISSUE_TITLE" \
                --label credential-health \
                --body "$(printf '%b' "$BODY")"
            fi
          fi
