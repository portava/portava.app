# live-db.yml — the credential-dependent tier.
#
# THE PROBLEM THIS FILE EXISTS TO SOLVE
#
# artifacts/api-server has three live-DB test suites that are deliberately kept
# out of the curated `test` script (which pins SUPABASE_URL=http://127.0.0.1:9,
# so registering them there would bury a permanent skip inside a green suite):
#
#   src/test/rlsHardening.test.ts
#   src/test/profileRoleNotSelfWritable.test.ts
#   src/test/isOfficialPrivileged.test.ts
#
# Keeping them out was correct. The cost is that the two tests guarding the
# profiles.role write boundary and the is_official trigger only ran when a
# human typed their script with real credentials.
#
# Worse: all three SKIP AND EXIT 0 when credentials are absent. Each computes
#   const CREDS_AVAILABLE = Boolean(SUPABASE_URL && SERVICE_ROLE_KEY && ANON_KEY);
# and passes `{ skip: !CREDS_AVAILABLE }` to every describe(). None of them
# sets process.exitCode. rlsHardening.test.ts's own header even states that
# "All tests are skipped when credentials are absent so CI still passes without
# a live Supabase connection" — the failure mode, written down as a feature.
#
# So the exit code of those three scripts is NOT a usable signal on its own.
# This file therefore does three things, in order:
#
#   1. PREFLIGHT. Every credential job asserts each secret it needs is
#      non-empty as its FIRST step and fails with a named message. A job that
#      silently skips because a secret is absent is the exact failure mode this
#      whole effort is about.
#   2. SANCTIONED-PROJECT ASSERTION (ALLOWLIST). The preflight refuses to run
#      unless the project ref resolved from SUPABASE_URL EQUALS the one CI
#      project ref the repo has sanctioned, supplied as the repo variable (or
#      environment secret) CI_SUPABASE_PROJECT_REF. Any other ref fails —
#      including a second production project nobody thought to list, a personal
#      project, or a typo that happens to resolve. This was a DENYLIST of one
#      hardcoded production ref; a denylist answers "is this the project I
#      thought to forbid?" when the question that matters is "is this the
#      project I sanctioned?". These suites create and delete real auth users
#      and transiently promote and demote a test victim, so the second question
#      is the only safe one. The production ref is kept as a SECONDARY
#      assertion, for the one case the allowlist cannot catch by itself: an
#      operator pointing CI_SUPABASE_PROJECT_REF at production.
#      One implementation, in .github/scripts/assert-nonprod-supabase.sh.
#
#      READ THIS BEFORE TRUSTING THE STEP: THIS STEP IS NO LONGER WHAT KEEPS
#      CI OFF PRODUCTION, AND IT MUST NOT BE RELIED ON AS IF IT WERE.
#      For five rounds the allowlist lived here, as a step, and everything else
#      was an attempt to prove the step was present, unconditional, first and
#      real. Every round was defeated by a construct the scan did not model —
#      comments, env indirection, `if:`, step order, shell conditionals,
#      secrets[...] index form — because a finite pattern set cannot close an
#      unbounded expression surface. So the assertion was moved INTO THE
#      EXECUTION PATH: artifacts/api-server/src/lib/ciSupabaseGuard.mjs is the
#      FIRST import of all eight entry points that can reach Supabase, runs the
#      same one implementation of the policy, and exits 2 before any client is
#      constructed or query issued. A job that omits this step, disables it with
#      `if:`, reorders it after install, or is a brand-new job in a brand-new
#      workflow file is STILL refused, by the process, at the moment it starts.
#      What survives here is a FAIL-FAST DUPLICATE: the same verdict about 90
#      seconds earlier, before checkout, corepack, cache restore and install are
#      paid for. Removing it costs latency, not safety.
#      See docs/ci/README.md § "The allowlist is enforced in the execution path".
#   3. OUTPUT CONTRACTS. Exit codes are not trusted alone. The live-DB suites
#      must report pass > 0 and skipped == 0; the live_pulse gate must print
#      its verdict line.
#
# Note what is NOT here: no `if: secrets.X != ''` job condition. That renders a
# missing secret as a grey SKIP on the PR, which reads as fine. Missing
# credentials must be red.
#
# Also not here: pnpm's workspace-selector form. It exits 0 when it matches
# nothing (pnpm 10.26.1: an unmatched selector prints "No projects matched the
# filters" and exits 0; a matched package with a missing script also exits 0),
# so a renamed package or a deleted script would report SUCCESS. Every package
# script goes through .github/scripts/pnpm-run.sh, which asserts the directory,
# the package name and the script exist first, and the credential-free
# `preflight` job re-asserts every one of them before any credential job runs.

name: CI (live DB)

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  # Drift between migrations and the live database is caused by database
  # changes, not by commits, so it is also checked on a fixed cadence.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# ONE SHARED NON-PRODUCTION SUPABASE PROJECT, ONE RUN AT A TIME.
#
# These jobs create auth users, mutate profiles.role / profiles.is_official, and
# attempt a (rolled-back) INSERT into public.rank_events. Two concurrent runs
# would race on each other's fixtures, so the group is deliberately GLOBAL — not
# keyed on github.ref — and in-progress runs are NOT cancelled, because
# cancelling mid-fixture leaves orphaned rows behind.
#
# WHAT THIS ACTUALLY DOES — corrected from an earlier comment (and doc) that
# claimed runs "queue":
#
#   THEY DO NOT QUEUE. GitHub keeps at most ONE in-progress run and at most ONE
#   pending run per concurrency group. When a third run arrives, the run that
#   was pending is CANCELLED and the newcomer takes its place. Because the group
#   is global, that eviction crosses refs: a push to branch B can cancel branch
#   A's pending live-DB run.
#
# That eviction is ACCEPTED here, in exchange for never racing two runs against
# one database. The consequence is stated rather than papered over:
#
#   * An evicted run is CANCELLED. GitHub renders that as "cancelled", never as
#     success, and a cancelled run does not satisfy a required status check. So
#     eviction can never turn into a false green.
#   * It CAN mean a commit has no live-DB verdict at all. "Not red" is not
#     "verified" for this workflow. If you need a verdict for a specific
#     commit that got evicted, re-run it (Actions -> Re-run all jobs) once the
#     in-progress run finishes.
#   * The `live-db-verdict` job at the bottom of this file runs with
#     `if: always()` and fails unless every other job in the run SUCCEEDED, so a
#     mid-run cancellation, or any skipped job, resolves to an explicit failure
#     with a message instead of an ambiguous grey.
#
# See docs/ci/README.md § "Concurrency: runs are evicted, not queued".
concurrency:
  group: live-db-shared-supabase-project
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  # THE ALLOWLIST. The one Supabase project ref CI is permitted to touch.
  # Supplied by the operator, not hardcoded here, because it names an
  # infrastructure choice this repo cannot make for you. A repo VARIABLE is the
  # normal home for it (a project ref is not a secret); an environment secret of
  # the same name also works and takes over if the variable is unset.
  #
  # If it is empty, every credential job FAILS CLOSED: with no sanctioned
  # project there is nothing to compare against, and an unverifiable target is
  # not a safe target.
  CI_SUPABASE_PROJECT_REF: ${{ vars.CI_SUPABASE_PROJECT_REF || secrets.CI_SUPABASE_PROJECT_REF }}
  # SECONDARY, and no longer the primary defence. The production project ref,
  # copied from .replit's [userenv.shared] SUPABASE_URL. The allowlist above
  # already rejects it along with every other unsanctioned ref; this catches the
  # one case the allowlist cannot — someone setting CI_SUPABASE_PROJECT_REF to
  # production. If production ever moves, update this value.
  KNOWN_PROD_PROJECT_REF: 'ajrurzioarfkagpuxfnb'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Credential-free fail-fast guard, identical to ci.yml's: every
  # (package directory, package name, script) triple named under .github/ must
  # exist on disk. Runs without secrets, without the shared database, and
  # without touching the concurrency-limited work below, so a renamed script is
  # a 20-second red instead of a green step that ran nothing.
  # ───────────────────────────────────────────────────────────────────────────
  preflight:
    name: preflight · every CI-invoked package script exists
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Assert every CI-invoked (package, script) pair exists
        shell: bash
        run: node .github/scripts/assert-ci-scripts.mjs

  # ───────────────────────────────────────────────────────────────────────────
  # The api-server aggregate, with credentials — all seven checks, including
  # the live_pulse deploy gate.
  #
  # This invokes the repo's own scripts/run-all-checks.sh rather than calling
  # the individual scripts, on purpose: run_gate()'s two-condition scoring
  # (exit 0 AND the literal `GATE live_pulse: PERMITTED` line) lives there and
  # should have exactly one implementation.
  # ───────────────────────────────────────────────────────────────────────────
  api-server-check-all:
    name: api-server · check:all + live_pulse gate (needs credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: preflight
    environment: ci-nonprod-supabase
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PROJECT_TOKEN: ${{ secrets.SUPABASE_PROJECT_TOKEN }}
    steps:
      # FIRST. Before checkout, before install, before anything.
      - name: Preflight — required secrets must be non-empty
        shell: bash
        run: |
          set -uo pipefail
          MISSING=0
          for NAME in SUPABASE_URL SUPABASE_PROJECT_TOKEN; do
            if [ -z "${!NAME:-}" ]; then
              echo "::error::Required secret $NAME is empty or not configured. This job does NOT skip when a secret is missing — a job that silently skips is indistinguishable from a job that passed, and that is the failure this CI exists to eliminate. Configure $NAME on the 'ci-nonprod-supabase' environment. See docs/ci/README.md."
              MISSING=1
            else
              echo "OK: $NAME is set (value not printed)."
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo ""
            echo "If this is a pull request from a FORK: GitHub does not expose"
            echo "repository or environment secrets to fork PRs, so this job cannot"
            echo "run and is reporting that fact loudly rather than passing."
            echo "See docs/ci/README.md § Fork pull requests."
            exit 1
          fi

      - uses: actions/checkout@v4

      # ALLOWLIST, not a denylist. One implementation of the policy, in
      # .github/scripts/assert-nonprod-supabase.sh.
      #
      # THIS STEP IS A FAIL-FAST DUPLICATE, NOT THE PROTECTION.
      # The load-bearing assertion is in the execution path: every entry point
      # this job eventually reaches imports
      # artifacts/api-server/src/lib/ciSupabaseGuard.mjs FIRST, which runs this
      # same script before any client is constructed and before any query, and
      # exits 2 if it refuses. Deleting this step, disabling it with `if:`,
      # moving it below install, or writing a new job that never had it does NOT
      # get past that. Verified by execution: with this step never run and
      # SUPABASE_URL pointing at the production ref, checkMediaObjects.ts,
      # checkMissingLiveColumns.ts, checkRankEventsSurfaces.ts and all three
      # live-DB suites exit 2 without issuing a request — and the suites never
      # even load @supabase/supabase-js.
      #
      # What this step buys is ~90 seconds: the same verdict before checkout
      # costs, corepack, cache restore and `pnpm install` are paid for. It fails
      # unless the project ref resolved from SUPABASE_URL equals the sanctioned
      # CI_SUPABASE_PROJECT_REF exactly; fails if that expectation is unset;
      # fails if the URL cannot be parsed into a ref at all. The production ref
      # is a secondary assertion inside the script.
      #
      # See docs/ci/README.md § "The allowlist is enforced in the execution path".
      - name: Preflight — Supabase target must be the sanctioned CI project
        shell: bash
        run: bash .github/scripts/assert-nonprod-supabase.sh

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          echo "pnpm $(pnpm --version)"
          node --version

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          set -euo pipefail
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-root-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-root-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install (root workspace, frozen lockfile)
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: 'check:all (7 checks incl. the live_pulse gate)'
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/api-check-all.log"

          bash .github/scripts/pnpm-run.sh artifacts/api-server @workspace/api-server check:all 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}

          # run-all-checks.sh already labels every check. Lift the labels into
          # the job summary so a failure names itself without anyone opening
          # the log.
          {
            echo "### api-server check:all — per-check results"
            echo ""
            echo '```'
            grep -E '(PASSED|FAILED):' "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$rc" -ne 0 ]; then
            echo "::error::api-server check:all failed (exit $rc). The FAILED lines above name the specific check. Reminder of the exit contract for check:rank-events-surfaces: 2 = CANNOT-RUN (missing credentials — a block, not a skip), 3 = BLOCKED (fail-closed), 1 = the script never chooses 1, so the process died involuntarily and proved nothing."
            exit "$rc"
          fi

          # Belt and braces on run_gate()'s output contract. run_gate() already
          # requires this line; asserting it again here means that if run_gate
          # is ever weakened or the gate is dropped from run-all-checks.sh, this
          # job notices instead of quietly losing the deploy gate.
          #
          # CONTRACT DUPLICATION: the EXIT CODE CONTRACT block in
          # src/scripts/checkRankEventsSurfaces.ts states it is mirrored in
          # docs/migrations.md, docs/algorithm/rank-events-signal-gaps.md and
          # scripts/run-all-checks.sh — "Change one, change all". This step is a
          # fourth place that depends on the literal verdict line. Add it to
          # that list when the contract changes.
          if ! grep -qxF 'GATE live_pulse: PERMITTED' "$LOG"; then
            echo "::error::check:all exited 0 but the literal line 'GATE live_pulse: PERMITTED' never appeared. An absent GATE line is a block, whatever the exit code. Either the gate did not reach a verdict, or the gate is no longer being run by scripts/run-all-checks.sh."
            exit 1
          fi
          echo "GATE live_pulse: PERMITTED — verdict line present."

  # ───────────────────────────────────────────────────────────────────────────
  # Migration / schema drift.
  #
  # auditMigrationsVsLive is the check that would have caught "12 of 15 live
  # triggers and 6 of 56 live functions have no migration authoring them". It
  # is invoked by NOTHING today: not check:all, not .replit. Its only other
  # caller is scripts/check-schema-audit.sh <- scripts/pre-release-check.sh,
  # which is itself invoked by nothing.
  #
  # EXPECT THIS JOB TO BE RED ON ITS FIRST RUN. The drift is real and already
  # documented. That red IS the finding, mechanized. The fix is to author the
  # missing migrations — not to delete this job, and emphatically not to
  # reuse scripts/pre-release-check.sh, which soft-skips this audit to exit 0
  # when no token is present ("so a network blip or a developer without
  # credentials is not blocked"). That is green-by-absence by design and must
  # not be copied into CI.
  # ───────────────────────────────────────────────────────────────────────────
  schema-drift:
    name: schema drift · migrations vs live (needs credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    environment: ci-nonprod-supabase
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PROJECT_TOKEN: ${{ secrets.SUPABASE_PROJECT_TOKEN }}
    steps:
      - name: Preflight — required secrets must be non-empty
        shell: bash
        run: |
          set -uo pipefail
          MISSING=0
          for NAME in SUPABASE_URL SUPABASE_PROJECT_TOKEN; do
            if [ -z "${!NAME:-}" ]; then
              echo "::error::Required secret $NAME is empty or not configured. This job fails rather than skips. See docs/ci/README.md."
              MISSING=1
            else
              echo "OK: $NAME is set (value not printed)."
            fi
          done
          if [ "$MISSING" -ne 0 ]; then exit 1; fi

      - uses: actions/checkout@v4

      # ALLOWLIST, not a denylist. One implementation of the policy, in
      # .github/scripts/assert-nonprod-supabase.sh.
      #
      # THIS STEP IS A FAIL-FAST DUPLICATE, NOT THE PROTECTION.
      # The load-bearing assertion is in the execution path: every entry point
      # this job eventually reaches imports
      # artifacts/api-server/src/lib/ciSupabaseGuard.mjs FIRST, which runs this
      # same script before any client is constructed and before any query, and
      # exits 2 if it refuses. Deleting this step, disabling it with `if:`,
      # moving it below install, or writing a new job that never had it does NOT
      # get past that. Verified by execution: with this step never run and
      # SUPABASE_URL pointing at the production ref, checkMediaObjects.ts,
      # checkMissingLiveColumns.ts, checkRankEventsSurfaces.ts and all three
      # live-DB suites exit 2 without issuing a request — and the suites never
      # even load @supabase/supabase-js.
      #
      # What this step buys is ~90 seconds: the same verdict before checkout
      # costs, corepack, cache restore and `pnpm install` are paid for. It fails
      # unless the project ref resolved from SUPABASE_URL equals the sanctioned
      # CI_SUPABASE_PROJECT_REF exactly; fails if that expectation is unset;
      # fails if the URL cannot be parsed into a ref at all. The production ref
      # is a secondary assertion inside the script.
      #
      # See docs/ci/README.md § "The allowlist is enforced in the execution path".
      - name: Preflight — Supabase target must be the sanctioned CI project
        shell: bash
        run: bash .github/scripts/assert-nonprod-supabase.sh

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          echo "pnpm $(pnpm --version)"
          node --version

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          set -euo pipefail
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-root-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-root-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install (root workspace, frozen lockfile)
        id: install
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      # Exit contract, read from source: 0 = clean, 1 = real drift,
      # 2 = cannot run (no SUPABASE_URL / no token). All three are handled;
      # 2 is a failure, not a skip.
      - name: 'audit:schema — migrations vs live schema'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/pnpm-run.sh artifacts/api-server @workspace/api-server audit:schema

      # Also invoked by nothing today. Its own source comment: "Exiting 2
      # rather than 0: an unrunnable check must not read as a passing one."
      - name: 'check:media-objects'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/pnpm-run.sh artifacts/api-server @workspace/api-server check:media-objects

  # ───────────────────────────────────────────────────────────────────────────
  # Migration 2089 rehearsal — before-proof, apply, after-proof.
  #
  # 2089_revoke_post_media_public_read.sql drops post_media_storage_public_read,
  # which grants role `public` SELECT on every object in the post-media bucket.
  # Measured against production on 2026-08-14 with nothing but the publishable
  # key that ships in the mobile client: object GET 200, bucket LIST returned
  # real user-UUID prefixes. This job runs that same drop against the SANCTIONED
  # CI PROJECT first, so the production apply repeats something already executed.
  #
  # WHY THE SEED STEP EXISTS. auditStagingBoundaryGrant.ts documents, for its own
  # change, that a CI proof would be "measuring residue" — its policies were
  # declared by no migration, so whether CI held them depended on what an earlier
  # run left behind. 2089's policy IS declared (0103_post_media.sql), so CI
  # genuinely has it. That is a claim about history, not about right now, so the
  # seed step establishes the precondition explicitly and says whether it had to.
  # Without it a drop against a project that never had the policy would be a
  # no-op reported as a change.
  #
  # THE PROOFS ARE THE POINT. A policy listing is a claim about the catalog; an
  # HTTP 200 returned to an anonymous caller is a fact about exposure. The audit
  # script carries three controls — stamp-artwork must still read (positive),
  # profile-media must still deny (negative), and a signed profile-media URL must
  # still fetch 200 (signing). If the positive control ever fails, a "denied"
  # result means the probe is broken, not that the bucket is safe, and the script
  # exits 1 rather than reporting a comfortable pass.
  #
  # This job WRITES to the CI project (seed creates a policy, apply drops one).
  # rehearsePostMediaRevocation.ts therefore imports the STRICT guard
  # ciSupabaseGuard.mjs, which permits only the sanctioned CI project and refuses
  # production unconditionally. There is no variable that points it at
  # production. The production apply is a separate, deliberate operator action.
  # ───────────────────────────────────────────────────────────────────────────
  post-media-revocation-rehearsal:
    name: post-media revocation · before-proof, apply, after-proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    environment: ci-nonprod-supabase
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PROJECT_TOKEN: ${{ secrets.SUPABASE_PROJECT_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Preflight — required secrets must be non-empty
        shell: bash
        run: |
          set -uo pipefail
          MISSING=0
          for NAME in SUPABASE_URL SUPABASE_PROJECT_TOKEN SUPABASE_SERVICE_ROLE_KEY EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!NAME:-}" ]; then
              echo "::error::Required secret $NAME is empty or not configured. This job fails rather than skips. The anon key in particular is not optional: it is the credential the exposure probe uses, and without it a pass would be vacuous. See docs/ci/README.md."
              MISSING=1
            else
              echo "OK: $NAME is set (value not printed)."
            fi
          done
          if [ "$MISSING" -ne 0 ]; then exit 1; fi

      - uses: actions/checkout@v4

      # Fail-fast duplicate of the in-process assertion. Both scripts this job
      # runs import a guard that runs this same script before any query.
      - name: Preflight — Supabase target must be the sanctioned CI project
        shell: bash
        run: bash .github/scripts/assert-nonprod-supabase.sh

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          echo "pnpm $(pnpm --version)"
          node --version

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          set -euo pipefail
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-root-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-root-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install (root workspace, frozen lockfile)
        id: install
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: 'Seed — establish the before-state (idempotent)'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/pnpm-run.sh artifacts/api-server @workspace/api-server rehearse:post-media-revocation:seed

      # Exit contract, read from source: 0 = BEFORE state (policy present AND
      # anonymous read/list reachable), 3 = AFTER state, 1 = a control failed or
      # catalog and reachability disagree, 2 = cannot run. Here we require 0:
      # anything else means the rehearsal is not starting from the state the
      # production apply will start from.
      - name: 'BEFORE-PROOF — expect exit 0 (grant present and reachable)'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          # set +e IS LOAD-BEARING. GitHub runs `shell: bash` as `bash -e`, and
          # this script's SUCCESS states are non-zero exit codes (0 = BEFORE,
          # 3 = AFTER). Without +e the step dies the instant the audit exits 3 —
          # before RC is read — so the after-proof reported failure while its own
          # output said "AFTER state confirmed". `set -uo pipefail` does NOT
          # clear -e; only `set +e` does.
          set +e
          set -uo pipefail
          bash .github/scripts/pnpm-run.sh artifacts/api-server @workspace/api-server audit:post-media-public-read
          RC=$?
          echo "audit exited $RC"
          if [ "$RC" -ne 0 ]; then
            echo "::error::before-proof expected exit 0 (BEFORE state) and got $RC. 3 means the policy was already gone — the seed step should have prevented that. 1 means a control failed, so the probe cannot tell denied from broken. 2 means it could not run. In none of those cases has the drop below been rehearsed against anything."
            exit 1
          fi

      - name: 'APPLY 2089 — drop the policy (CI project only)'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/pnpm-run.sh artifacts/api-server @workspace/api-server rehearse:post-media-revocation:apply

      - name: 'AFTER-PROOF — expect exit 3 (denied, signing intact)'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          # set +e IS LOAD-BEARING. GitHub runs `shell: bash` as `bash -e`, and
          # this script's SUCCESS states are non-zero exit codes (0 = BEFORE,
          # 3 = AFTER). Without +e the step dies the instant the audit exits 3 —
          # before RC is read — so the after-proof reported failure while its own
          # output said "AFTER state confirmed". `set -uo pipefail` does NOT
          # clear -e; only `set +e` does.
          set +e
          set -uo pipefail
          bash .github/scripts/pnpm-run.sh artifacts/api-server @workspace/api-server audit:post-media-public-read
          RC=$?
          echo "audit exited $RC"
          if [ "$RC" -ne 3 ]; then
            echo "::error::after-proof expected exit 3 (AFTER state: policy gone, anonymous read and list denied, signing control still 200) and got $RC. 0 would mean the drop did not take effect. 1 is the dangerous one: it includes the case where the policy is gone but an anonymous caller can STILL read, which means another grant exists and the change looks done without being done. Do not apply this to production until this is explained."
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # The three live-DB security suites.
  #
  # These are the ones that skip-and-exit-0 without credentials. The preflight
  # above is the primary defence; the per-suite output assertions below are the
  # second. Do not remove either.
  # ───────────────────────────────────────────────────────────────────────────
  live-db-security-suites:
    name: live DB · RLS + role/is_official write boundaries (needs credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: preflight
    environment: ci-nonprod-supabase
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Preflight — required secrets must be non-empty
        shell: bash
        run: |
          set -uo pipefail
          MISSING=0
          # All three are required by CREDS_AVAILABLE in each suite. If any one
          # is empty, every describe() in all three files is skipped and the
          # process exits 0 having asserted nothing.
          for NAME in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!NAME:-}" ]; then
              echo "::error::Required secret $NAME is empty or not configured. Without it the live-DB suites SKIP EVERY TEST AND EXIT 0 — they would report green having asserted nothing about the profiles.role write boundary or the is_official trigger. This job fails instead. See docs/ci/README.md."
              MISSING=1
            else
              echo "OK: $NAME is set (value not printed)."
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo ""
            echo "If this is a pull request from a FORK: GitHub does not expose"
            echo "repository or environment secrets to fork PRs. Without this"
            echo "preflight the suites would have gone GREEN having verified"
            echo "nothing. Red is the correct outcome."
            exit 1
          fi

      - uses: actions/checkout@v4

      # ALLOWLIST, not a denylist. One implementation of the policy, in
      # .github/scripts/assert-nonprod-supabase.sh.
      #
      # THIS STEP IS A FAIL-FAST DUPLICATE, NOT THE PROTECTION.
      # The load-bearing assertion is in the execution path: every entry point
      # this job eventually reaches imports
      # artifacts/api-server/src/lib/ciSupabaseGuard.mjs FIRST, which runs this
      # same script before any client is constructed and before any query, and
      # exits 2 if it refuses. Deleting this step, disabling it with `if:`,
      # moving it below install, or writing a new job that never had it does NOT
      # get past that. Verified by execution: with this step never run and
      # SUPABASE_URL pointing at the production ref, checkMediaObjects.ts,
      # checkMissingLiveColumns.ts, checkRankEventsSurfaces.ts and all three
      # live-DB suites exit 2 without issuing a request — and the suites never
      # even load @supabase/supabase-js.
      #
      # What this step buys is ~90 seconds: the same verdict before checkout
      # costs, corepack, cache restore and `pnpm install` are paid for. It fails
      # unless the project ref resolved from SUPABASE_URL equals the sanctioned
      # CI_SUPABASE_PROJECT_REF exactly; fails if that expectation is unset;
      # fails if the URL cannot be parsed into a ref at all. The production ref
      # is a secondary assertion inside the script.
      #
      # See docs/ci/README.md § "The allowlist is enforced in the execution path".
      - name: Preflight — Supabase target must be the sanctioned CI project
        shell: bash
        run: bash .github/scripts/assert-nonprod-supabase.sh

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          echo "pnpm $(pnpm --version)"
          node --version

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          set -euo pipefail
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-root-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-root-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install (root workspace, frozen lockfile)
        id: install
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      # Each suite is its own step so a failure names the boundary it guards.
      # All fourteen run even if an earlier one failed.
      - name: 'test:rls-hardening (RLS policies, anon + wrong-user reads)'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          bash .github/scripts/run-live-suite.sh rls-hardening artifacts/api-server @workspace/api-server test:rls-hardening

      - name: 'test:profile-role-not-self-writable (profiles.role write boundary)'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          bash .github/scripts/run-live-suite.sh profile-role-not-self-writable artifacts/api-server @workspace/api-server test:profile-role-not-self-writable

      - name: 'test:is-official-privileged (is_official trigger)'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          bash .github/scripts/run-live-suite.sh is-official-privileged artifacts/api-server @workspace/api-server test:is-official-privileged

      - name: 'test:local-guide-self-promotion (guide privilege write boundary)'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          bash .github/scripts/run-live-suite.sh local-guide-self-promotion artifacts/api-server @workspace/api-server test:local-guide-self-promotion

      - name: 'test:rbp-self-verification (buddy verification write boundary)'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          bash .github/scripts/run-live-suite.sh rbp-self-verification artifacts/api-server @workspace/api-server test:rbp-self-verification

      - name: 'test:rba-self-approval (buddy application approval boundary)'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          bash .github/scripts/run-live-suite.sh rba-self-approval artifacts/api-server @workspace/api-server test:rba-self-approval

      - name: 'test:gem-self-publish (hidden_gems publication boundary)'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          bash .github/scripts/run-live-suite.sh gem-self-publish artifacts/api-server @workspace/api-server test:gem-self-publish

      - name: 'test:post-verify-boundary (posts verification/authority boundary)'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          bash .github/scripts/run-live-suite.sh post-verify-boundary artifacts/api-server @workspace/api-server test:post-verify-boundary

      - name: 'test:passport-stamp-verify (passport_stamps verification boundary)'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          bash .github/scripts/run-live-suite.sh passport-stamp-verify artifacts/api-server @workspace/api-server test:passport-stamp-verify

      - name: 'test:passport-memory-verify (passport_memories verification boundary)'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          bash .github/scripts/run-live-suite.sh passport-memory-verify artifacts/api-server @workspace/api-server test:passport-memory-verify

      - name: 'test:passport-postcard-verify (passport_postcards location-verification boundary)'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          bash .github/scripts/run-live-suite.sh passport-postcard-verify artifacts/api-server @workspace/api-server test:passport-postcard-verify

      - name: 'test:passport-postcard-status (passport_postcards moderation-status boundary)'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          bash .github/scripts/run-live-suite.sh passport-postcard-status artifacts/api-server @workspace/api-server test:passport-postcard-status

      - name: 'test:discovery-place-boundary (discovery_places client-write boundary)'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          bash .github/scripts/run-live-suite.sh discovery-place-boundary artifacts/api-server @workspace/api-server test:discovery-place-boundary

      - name: 'test:hgv-trust-boundary (hidden_gem_visits trust_level boundary)'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          bash .github/scripts/run-live-suite.sh hgv-trust-boundary artifacts/api-server @workspace/api-server test:hgv-trust-boundary

  # ───────────────────────────────────────────────────────────────────────────
  # THE VERDICT. A cancelled, skipped or failed job must not read as a pass.
  #
  # This workflow's concurrency group is global and does NOT queue: GitHub keeps
  # one in-progress run and one pending run per group, and a newcomer CANCELS
  # the pending one — across refs, because the group is not keyed on the ref.
  # Eviction is accepted (see the concurrency block above), but its rendering
  # must never be ambiguous.
  #
  # `if: always()` makes this job run even when an upstream job was cancelled or
  # skipped. It then asserts that every upstream job reported 'success' and
  # fails otherwise, so:
  #   * a job cancelled mid-run  -> explicit failure, naming the job
  #   * a job skipped because a `needs` failed -> explicit failure
  #   * a job that failed        -> explicit failure
  # The only way this job passes is if all three credential jobs and the
  # preflight actually ran and actually succeeded.
  #
  # A run evicted while still PENDING never starts any job, so nothing here can
  # execute for it; that run is rendered "cancelled" by GitHub and satisfies no
  # required status check. That is the documented residual, not a silent one.
  # ───────────────────────────────────────────────────────────────────────────
  live-db-verdict:
    name: live DB · verdict (cancelled or skipped is not a pass)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - preflight
      - api-server-check-all
      - schema-drift
      - live-db-security-suites
      - post-media-revocation-rehearsal
    steps:
      - name: Every live-DB job must have run and succeeded
        shell: bash
        env:
          R_PREFLIGHT: ${{ needs.preflight.result }}
          R_CHECK_ALL: ${{ needs['api-server-check-all'].result }}
          R_SCHEMA_DRIFT: ${{ needs['schema-drift'].result }}
          R_SECURITY_SUITES: ${{ needs['live-db-security-suites'].result }}
          R_REVOCATION_REHEARSAL: ${{ needs['post-media-revocation-rehearsal'].result }}
        run: |
          set -uo pipefail
          BAD=0
          {
            echo "### live-DB run verdict"
            echo ""
            echo "| job | result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for PAIR in \
            "preflight:$R_PREFLIGHT" \
            "api-server-check-all:$R_CHECK_ALL" \
            "schema-drift:$R_SCHEMA_DRIFT" \
            "live-db-security-suites:$R_SECURITY_SUITES" \
            "post-media-revocation-rehearsal:$R_REVOCATION_REHEARSAL"
          do
            NAME="${PAIR%%:*}"
            RESULT="${PAIR#*:}"
            echo "| $NAME | ${RESULT:-unknown} |" >> "$GITHUB_STEP_SUMMARY"
            echo "$NAME: ${RESULT:-unknown}"
            if [ "$RESULT" != "success" ]; then
              echo "::error::Job '$NAME' reported '${RESULT:-unknown}', not 'success'. A cancelled or skipped live-DB job has verified nothing about the RLS policies, the profiles.role write boundary, the is_official trigger, or schema drift. It is not a pass. If the cause was concurrency eviction (this workflow's group is global and evicts the pending run rather than queueing it), re-run this workflow once the in-progress run has finished."
              BAD=1
            fi
          done

          if [ "$BAD" -ne 0 ]; then
            {
              echo ""
              echo "> **This run did not verify the live database.** At least one job did not"
              echo "> reach a successful conclusion. See the annotations above."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All live-DB jobs ran and succeeded."
