# beta-config.yml — configure portava-beta AFTER beta-db.yml has built it:
# close sign-up in Supabase Auth, set the redirect URLs, set every feature flag
# to scripts/src/beta-flag-policy.json, and read both back.
# workflow_dispatch ONLY, behind a typed confirmation.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT IT DOES
# ─────────────────────────────────────────────────────────────────────────────
# Target: portava-beta, ref emfpckykpzfturllshly. Nothing else, ever:
#   * SUPABASE_URL and CI_SUPABASE_PROJECT_REF are LITERALS below, both naming
#     emfpckykpzfturllshly, visible in review;
#   * assert-nonprod-supabase.sh (the unconditional step below) and
#     ciSupabaseGuard.mjs (imported first by the script) refuse any other ref,
#     and production always;
#   * scripts/src/beta-configure.ts HARD-CODES the beta ref and exits 2 for any
#     other — portava-ci included.
#
# scripts/src/beta-configure.ts, in order (the first failure stops the run):
#   a. guards + the flag policy validated against the migrations' flag population;
#   b. Auth: PATCH /v1/projects/{ref}/config/auth with disable_signup=true,
#      site_url=https://portava-beta.replit.app and
#      uri_allow_list=travelbuddy://**,https://portava-beta.replit.app/** — then
#      GET it back and compare;
#   c. flags: every row set to the policy in ONE transaction with an audit row per
#      flip; a policy flag missing from the database writes NOTHING and fails;
#   d. read-back of every flag;
#   e. READ-ONLY: the client grants on public.profiles. Exit 1 while anon or
#      authenticated hold TABLE-level SELECT/UPDATE there or SELECT on a
#      personal column — the grant a baseline replay inherits until migration
#      3740 (PR #647) is in the chain — or UPDATE on one of the nineteen
#      authority columns, or while 3742's trigger (PR #653) is absent,
#      disabled or conditional (WHEN), its function no longer compares or
#      refuses before RETURN, or the predicate it trusts
#      (caller_may_write_profile_role(), 2078) is missing or no longer reads
#      the role GUC and session_user — the textual checks of 3742's own
#      postcondition. No tester account before this is green.
# Exit 2 = refused before any write; 1 = a request failed or a read-back differs.
#
# The run-name states the mode and what step e verified. beta:status (gate 3c,
# scripts/src/beta-owner.ts) accepts only an APPLYING run whose title carries
# PROFILES_BOUNDARY_MARKER (scripts/src/beta-config-core.ts; pinned by
# beta-owner.test.ts), so a run made by older code, or a dry run (which only
# warns), never opens the tester gate.
#
# The ONE secret is BETA_SUPABASE_PROJECT_TOKEN (the same one beta-db.yml's
# beta job reads), mapped into SUPABASE_PROJECT_TOKEN. It must be a Management
# API token that can reach portava-beta; the CI token answers 403 there.
#
# Runbook: docs/ops/beta-runtime-runbook.md. Dispatch, after beta-db.yml is green:
#   gh workflow run beta-config.yml -f confirm=CONFIGURE-BETA
#   gh workflow run beta-config.yml -f confirm=CONFIGURE-BETA -f dry_run=yes
#
# Same known gap as beta-db.yml (see its header): .github/scripts/assert-ci-scripts.mjs
# declares credential jobs for live-db.yml only. The job here is inside the two
# mechanisms that hold the line — the in-process guard and the unconditional
# allowlist step — and the preflight still asserts every (package, script) pair.

name: Beta config (portava-beta auth + flags)
run-name: "beta-config · ${{ inputs.confirm }}${{ inputs.dry_run == 'yes' && ' · dry-run' || ' · apply' }} · profiles boundary 3740+3742 v2"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          Closes sign-up in Supabase Auth on portava-beta (emfpckykpzfturllshly),
          sets its redirect URLs and sets every feature flag to
          scripts/src/beta-flag-policy.json. Type exactly: CONFIGURE-BETA
        required: true
        type: string
      dry_run:
        description: >-
          Optional: type exactly yes to read and print the plan without writing.
          Leave empty to apply.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: beta-db
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  KNOWN_PROD_PROJECT_REF: 'ajrurzioarfkagpuxfnb'

jobs:
  preflight:
    name: preflight · every CI-invoked package script exists + exact dispatch inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Assert every CI-invoked (package, script) pair exists
        shell: bash
        run: node .github/scripts/assert-ci-scripts.mjs
      - name: Dispatch inputs must be exact
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          if [ "$CONFIRM" != "CONFIGURE-BETA" ]; then
            echo "::error::The confirm input must be exactly CONFIGURE-BETA. Nothing was run."
            exit 1
          fi
          case "$DRY_RUN" in
            "") echo "dry_run: no — the configuration will be WRITTEN to portava-beta." ;;
            yes) echo "dry_run: yes — read and plan only." ;;
            *)
              echo "::error::The dry_run input must be empty or exactly yes. Refusing rather than guessing."
              exit 1 ;;
          esac

  beta-config:
    name: beta · configure portava-beta (auth + flags), read back
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    if: ${{ inputs.confirm == 'CONFIGURE-BETA' }}
    environment: ci-nonprod-supabase
    env:
      SUPABASE_URL: 'https://emfpckykpzfturllshly.supabase.co'
      CI_SUPABASE_PROJECT_REF: 'emfpckykpzfturllshly'
      SUPABASE_PROJECT_TOKEN: ${{ secrets.BETA_SUPABASE_PROJECT_TOKEN }}
    steps:
      - name: Preflight — required secrets must be non-empty
        shell: bash
        run: |
          set -uo pipefail
          MISSING=0
          for NAME in SUPABASE_URL SUPABASE_PROJECT_TOKEN; do
            if [ -z "${!NAME:-}" ]; then
              echo "::error::Required value $NAME is empty or not configured. In this job SUPABASE_PROJECT_TOKEN is mapped from the environment secret BETA_SUPABASE_PROJECT_TOKEN — a Management API token that can reach portava-beta (emfpckykpzfturllshly). This job fails rather than skips."
              MISSING=1
            else
              echo "OK: $NAME is set (value not printed)."
            fi
          done
          if [ "$MISSING" -ne 0 ]; then exit 1; fi

      - uses: actions/checkout@v4

      - name: Preflight — Supabase target must be the sanctioned project (portava-beta in this job)
        shell: bash
        run: bash .github/scripts/assert-nonprod-supabase.sh

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          echo "pnpm $(pnpm --version)"
          node --version

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          set -euo pipefail
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-root-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-root-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install (root workspace, frozen lockfile)
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: 'db:beta-configure — auth config + flag policy, read back'
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "yes" ]; then
            bash .github/scripts/pnpm-run.sh scripts @workspace/scripts db:beta-configure --confirm=CONFIGURE-BETA --dry-run
          else
            bash .github/scripts/pnpm-run.sh scripts @workspace/scripts db:beta-configure --confirm=CONFIGURE-BETA
          fi

  verdict:
    name: beta-config · verdict (skipped or cancelled is not a pass)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - preflight
      - beta-config
    steps:
      - uses: actions/checkout@v4
      - name: Classify the run — PASS / FAIL / NOT EXECUTED
        shell: bash
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          CONFIG_RESULT: ${{ needs['beta-config'].result }}
        run: bash .github/scripts/live-db-verdict.sh "preflight=${PREFLIGHT_RESULT}" "beta-config=${CONFIG_RESULT}"
