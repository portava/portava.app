# source-cache-warm.yml — keeps the three pinned source archives that ci.yml
# builds its test toolchains from (PostgreSQL 17.11, ffmpeg 8.0 and x264
# b35605a) in the Actions cache, so that a quiet week cannot evict them and an
# upstream outage cannot block a merge.
#
# WHY THIS EXISTS. GitHub evicts a cache entry seven days after it was last
# restored, and ci.yml restores these three only on a push or a pull request.
# After a week without either, the next PR has to fetch all three from
# upstream again. On 2026-11-03 that coincided with ffmpeg.org timing out from
# GitHub's runners for about an hour (16:40 to 17:10 UTC): #810 stayed red for
# that hour although every one of its 41,588 tests had passed. The archives
# are pinned by SHA-256, so the only thing a download can add is availability
# risk; this workflow removes most of it by restoring the entries every third
# day on main, well inside the seven-day window. A pull request's run reads
# main's cache, so it starts from a hit.
#
# WHAT IT DOES AND DOES NOT DO. It runs no tests and changes nothing in the
# tree. When both caches hit it stops after the two restore steps (the restore
# itself is what refreshes the entry's age). When one misses it runs the same
# preparation script ci.yml runs for that archive set, which downloads through
# curl, verifies the SHA-256 before extracting anything and builds into
# RUNNER_TEMP exactly as the test job would; the post-job cache save then
# stores the verified archive under the same key. There is no second download
# path, so the pins and the verification stay in one place: the two prepare
# scripts under .github/scripts/. The cache `path:` and `key:` lines below are
# copied from ci.yml and must stay byte-identical to it, or this workflow would
# warm entries nobody reads.
#
# The cron is offset from live-db.yml (17 6 * * *), clean-build-proof.yml
# (47 3 * * *) and story-retention.yml (23 * * * *). GitHub runs scheduled
# workflows late, or drops a firing under load; a late or missed run is
# harmless here because the margin is four days, and workflow_dispatch exists
# for the day someone wants it warm now.
name: source cache warm

on:
  schedule:
    - cron: '41 4 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-cache-warm
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  warm:
    name: source cache · restore the pinned archives, re-download only on a miss
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Same path and key as ci.yml's "Cache pinned PostgreSQL source archive".
      - name: Cache pinned PostgreSQL source archive
        id: postgres-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/memory-postgres-source/postgresql-17.11.tar.bz2
          key: memory-postgres-source-17.11-dd27f2b3c59e73ed14aa3324901242bf69a032a6347805f274e6260322d42979

      # Same paths and key as ci.yml's "Cache pinned media encoding source archives".
      - name: Cache pinned media encoding source archives
        id: media-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/media-encoding-source/ffmpeg-8.0.tar.xz
            ${{ runner.temp }}/media-encoding-source/x264-b35605ace3ddf7c1a5d67a2eb553f034aef41d55.tar.gz
          key: media-encoding-source-v1-b2751fccb6cc4c77708113cd78b561059b6fa904b24162fa0be2d60273d27b8e-cd71a7515b0e9a012e1ac9b1f8415bebcaf6fc97d4db32286642ac4c0fbe24f9

      - name: Re-download and verify the PostgreSQL source (cache missed)
        if: steps.postgres-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/prepare-memory-native-postgres.mjs 2>&1 | tee "$RUNNER_TEMP/memory-native-prepare.log"

      - name: Re-download and verify the media encoding sources (cache missed)
        if: steps.media-cache.outputs.cache-hit != 'true'
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/prepare-media-encoding-tools.mjs 2>&1 | tee "$RUNNER_TEMP/media-encoding-prepare.log"

      - name: Summary
        shell: bash
        env:
          POSTGRES_HIT: ${{ steps.postgres-cache.outputs.cache-hit }}
          MEDIA_HIT: ${{ steps.media-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          describe() { if [ "$1" = "true" ]; then echo "hit, age refreshed"; else echo "miss, re-downloaded, verified and saved"; fi; }
          {
            echo "### source cache warm"
            echo ""
            echo "| archive set | this run |"
            echo "| --- | --- |"
            echo "| PostgreSQL 17.11 | $(describe "$POSTGRES_HIT") |"
            echo "| ffmpeg 8.0 + x264 b35605a | $(describe "$MEDIA_HIT") |"
          } >> "$GITHUB_STEP_SUMMARY"
