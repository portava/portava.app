# live-db-coverage.yml — DOES EVERY OPEN PULL REQUEST HAVE A LIVE-DB RUN AT ALL.
#
# THE DEFECT, MEASURED 2026-10-03.
#
# A pull request with a merge conflict gets NO `CI (live DB)` workflow run
# created. GitHub cannot build the merge ref, so it never fires the
# `pull_request` event. `ci.yml` and `unwired-checks.yml` still run on `push`
# and report green, so the PR's check list reads FULLY GREEN with no
# live-database certification and not even a grey entry for the missing one.
#
#   PR #530, head 846f58e7…  11 check runs, all success, no live-DB check-run
#                             name present at all. Its branch's newest live-DB
#                             run (37097887542) was against an EARLIER commit,
#                             0cb20f42….
#   PR #393, head 1b78d3b6…  10 check runs, all success, dirty since
#                             2026-09-05. Newest live-DB run on its branch
#                             (33961248341) against a different commit.
#
# This is the same class of failure as PR #339's 20/20 green with zero live-DB
# entries (docs/ci/README.md), with a different cause: there the runs were
# evicted, here they were never created.
#
# WHY THE FIX CANNOT LIVE IN live-db.yml
# --------------------------------------
# Nothing a workflow declares makes an event fire that GitHub never sent. The
# trigger that would have covered it, `push: ['**']`, was deliberately removed
# on measured evidence — 64 of 100 runs cancelled, 23 failure, 12 success, and
# 45% of commits receiving NO verdict at all — see docs/ci/README.md
# § "Concurrency: the shared database is a queue, not a race". Re-adding it
# would reintroduce exactly the defect that change fixed. The absence is only
# observable from OUTSIDE the missing run, which is what this file is.
#
# WHY THIS IS ITS OWN WORKFLOW AND NOT A JOB IN ci.yml
# ----------------------------------------------------
# It was built as a job in `ci.yml` first, and that was wrong for a structural
# reason worth writing down so it is not re-attempted.
#
# The question is REPO-WIDE: "does every open PR have a run". `ci.yml` is
# PER-BRANCH — it triggers on `push: ['**']` and `pull_request`. So a single
# stale conflicted PR that nobody is working on would turn EVERY branch's CI
# red. Worse, src/test/ciWorkflowArchitecture.test.ts requires every job in
# `ci.yml` to appear in `ci-verdict`'s `needs:` ("Every job added to this
# workflow must be added to the verdict in the same commit"), and `ci-verdict`
# is the context branch protection is meant to require on `main`. The result
# would be one conflicted PR blocking the merge of every other PR — a far
# larger blast radius than the defect being reported.
#
# A repo-wide question therefore gets a repo-wide trigger, and reds its own
# board and nothing else. `ci.yml` is untouched.
#
# WHY IT IS CREDENTIAL-FREE AND MUST STAY THAT WAY
# ------------------------------------------------
# It reads GitHub's own run history and nothing else: no secret, no database,
# no Supabase project. It uses `github.token`, the automatically-minted per-run
# token, not a configured repository secret. That matters beyond tidiness — the
# condition this workflow reports is "the credentialed lane did not run", so it
# must not be able to fail for the same reasons that lane does.
#
# THE TRIGGERS, AND WHAT EACH ONE IS FOR
# --------------------------------------
#   push: [main]   The CAUSAL event. A merge to `main` is what makes an open PR
#                  conflict, so this is the moment the population of at-risk
#                  PRs changes. Nothing per-branch and nothing on
#                  `pull_request`: see above.
#   schedule       The backstop, because the state can also change with no
#                  push at all — a run can be deleted, and a PR's head can
#                  cross the log-retention horizon while the repository sits
#                  idle. `41 */6 * * *` is deliberately off the hour (GitHub
#                  names the top of the hour as a high-load time and delays
#                  scheduled runs under it) and deliberately offset from
#                  live-db.yml's `17 6`, clean-build-proof.yml's `47 3` and
#                  story-retention.yml's `23 *`. Six-hourly rather than daily
#                  because the worst-case time a conflicted PR spends looking
#                  fully green is the cadence; rather than hourly because the
#                  state does not change that fast and each pass costs ~2N API
#                  calls.
#   workflow_dispatch  So a human can ask the question now, which is also how
#                  you confirm a fix without waiting for the cron.
#
# TWO KNOWN COSTS OF `schedule`, STATED RATHER THAN DISCOVERED LATER, both of
# them already documented in story-retention.yml's header:
#   * On a PUBLIC repository GitHub DISABLES a scheduled workflow after 60 days
#     with no repository activity. That is structurally the same failure this
#     file reports — a check that stops without telling anyone. `push: [main]`
#     is the half that does not expire, and it is why there are two triggers
#     rather than one.
#   * A `schedule` only ever runs from the DEFAULT BRANCH. Until this file is
#     on `main` the cron does nothing; `workflow_dispatch` is how it is
#     exercised before then.
#
# WHAT A RED HERE MEANS
# ---------------------
# Two states, never merged, because the remedies differ:
#   UNCERTIFIED   no run exists for this head SHA and the absence is real.
#                 Resolve the conflict and push, or dispatch `CI (live DB)`
#                 against the branch.
#   UNMEASURABLE  the head SHA predates the oldest `CI (live DB)` run still
#                 visible, so a run may have existed and been deleted by log
#                 retention. Nothing is established — decide whether a PR that
#                 old should still be open.
# Both FAIL. Neither is a claim that the database is broken, and neither is a
# claim that any certification PASSED; existence is all that is asserted.

name: live-DB coverage

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

# Least privilege, and every scope is read-only. `actions: read` lists this
# repository's workflow runs; `pull-requests: read` lists the open PRs;
# `contents: read` is what actions/checkout needs. Nothing here writes
# anything, comments on anything or publishes anything.
permissions:
  contents: read
  actions: read
  pull-requests: read

# One pass at a time, and a superseded pass is CANCELLED rather than queued:
# the answer is a snapshot of the open PRs, so an older in-flight pass is
# answering a question the newer one is about to answer better. A cancelled run
# renders as "cancelled", not as success, and the verdict job below treats it
# as a failure, so this cannot hide anything.
concurrency:
  group: live-db-coverage
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # The detector. FAILS, never warns, and fails the same way when it cannot
  # establish its result: an unreadable Actions API, an unresolvable workflow
  # name, an unreadable head-commit date and an empty PR listing that the
  # repository's own open-issue count contradicts all exit non-zero. "I could
  # not see a missing run" is not "no run is missing" — the rule stated at the
  # top of ci.yml and in run_gate() in
  # artifacts/api-server/scripts/run-all-checks.sh.
  #
  # The predicate itself is in .github/scripts/live-db-coverage-decide.sh,
  # which takes the per-PR listing on stdin and touches no network, so it is
  # executed by src/test/ciWorkflowArchitecture.test.ts against the listing
  # measured on 2026-10-03 rather than trusted. That is the same split as
  # live-db-acquire-slot.sh / live-db-slot-decide.sh, for the same reason: only
  # the fetcher needs the network, and only the decision can be wrong.
  # ───────────────────────────────────────────────────────────────────────────
  coverage:
    name: live-DB coverage · every open PR head SHA has a run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Every open PR head SHA must have a CI (live DB) run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/assert-live-db-coverage.sh

  # ───────────────────────────────────────────────────────────────────────────
  # THE VERDICT. A skipped, cancelled or failed job must not read as a pass.
  #
  # The same job that live-db.yml, ci.yml and unwired-checks.yml each carry, for
  # the same reason, and it is NOT redundant with a single-job workflow. A job
  # that is cancelled — by the `concurrency` group above, by a repository-wide
  # cancellation, by a runner dying — reports `cancelled`, and a workflow whose
  # only job was cancelled does not report failure in every surface that reads
  # it. `if: always()` makes this run anyway and turn anything that is not
  # `success` into an explicit red that NAMES the job.
  #
  # This is also the job to put in branch protection or a required-checks
  # ruleset if this workflow is ever wired into one: it is the only one whose
  # success implies the detector actually ran.
  # ───────────────────────────────────────────────────────────────────────────
  coverage-verdict:
    name: live-DB coverage · verdict (skipped or cancelled is not a pass)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - coverage
    steps:
      - name: The coverage job must have run and succeeded
        shell: bash
        env:
          R_COVERAGE: ${{ needs.coverage.result }}
        run: |
          set -uo pipefail
          BAD=0
          {
            echo "### live-DB coverage run verdict"
            echo ""
            echo "| job | result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for PAIR in \
            "coverage:$R_COVERAGE"
          do
            NAME="${PAIR%%:*}"
            RESULT="${PAIR#*:}"
            echo "| $NAME | ${RESULT:-unknown} |" >> "$GITHUB_STEP_SUMMARY"
            echo "$NAME: ${RESULT:-unknown}"
            if [ "$RESULT" != "success" ]; then
              echo "::error::Job '$NAME' reported '${RESULT:-unknown}', not 'success'. A skipped or cancelled job verified NOTHING about which open pull requests hold a live-database certification — and this workflow exists precisely because 'did not run' is indistinguishable from 'passed' in GitHub's check list. Re-run it."
              BAD=1
            fi
          done

          if [ "$BAD" -ne 0 ]; then
            {
              echo ""
              echo "> **This run did not establish live-DB coverage of the open pull requests.**"
              echo "> The detector did not reach a successful conclusion. See the annotations above."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "The coverage detector ran and succeeded."
