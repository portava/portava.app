name: Standalone dependency sync check

on:
  push:
    branches: ["**"]
    paths:
      - "artifacts/travel-buddy/package.json"
      - "travel-buddy-standalone/package.json"
      - "scripts/sync-standalone.sh"
      - "pnpm-workspace.yaml"
      - "artifacts/travel-buddy/tsconfig.json"
      - "travel-buddy-standalone/tsconfig.json"
      - "artifacts/travel-buddy/babel.config.js"
      - "travel-buddy-standalone/babel.config.js"
      - "artifacts/travel-buddy/metro.config.js"
      - "travel-buddy-standalone/metro.config.js"
      - "artifacts/travel-buddy/app.json"
      - "travel-buddy-standalone/app.json"
      - "artifacts/travel-buddy/.env.example"
      - "travel-buddy-standalone/.env.example"
      - "travel-buddy-standalone/**/*.ts"
      - "travel-buddy-standalone/**/*.tsx"
      - "artifacts/travel-buddy/**/*.ts"
      - "artifacts/travel-buddy/**/*.tsx"
      - "artifacts/travel-buddy/src/**"
      - "travel-buddy-standalone/src/**"
      - "artifacts/travel-buddy/app/**"
      - "travel-buddy-standalone/app/**"
  pull_request:
    branches: ["**"]
    paths:
      - "artifacts/travel-buddy/package.json"
      - "travel-buddy-standalone/package.json"
      - "scripts/sync-standalone.sh"
      - "pnpm-workspace.yaml"
      - "artifacts/travel-buddy/tsconfig.json"
      - "travel-buddy-standalone/tsconfig.json"
      - "artifacts/travel-buddy/babel.config.js"
      - "travel-buddy-standalone/babel.config.js"
      - "artifacts/travel-buddy/metro.config.js"
      - "travel-buddy-standalone/metro.config.js"
      - "artifacts/travel-buddy/app.json"
      - "travel-buddy-standalone/app.json"
      - "artifacts/travel-buddy/.env.example"
      - "travel-buddy-standalone/.env.example"
      - "travel-buddy-standalone/**/*.ts"
      - "travel-buddy-standalone/**/*.tsx"
      - "artifacts/travel-buddy/**/*.ts"
      - "artifacts/travel-buddy/**/*.tsx"
      - "artifacts/travel-buddy/src/**"
      - "travel-buddy-standalone/src/**"
      - "artifacts/travel-buddy/app/**"
      - "travel-buddy-standalone/app/**"

jobs:
  sync-standalone-check:
    name: Check standalone dep/config sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Check standalone dependency and config sync
        run: bash scripts/sync-standalone.sh --dry-run

  source-drift-check:
    name: Check standalone source sync (src/ app/)
    runs-on: ubuntu-latest
    env:
      # Set to a positive integer to allow a temporary grace margin during a
      # large-batch sync. Default is 0 — any divergence fails the build.
      SOURCE_DRIFT_THRESHOLD: 0
    steps:
      - uses: actions/checkout@v4

      - name: Diff source directories
        run: bash scripts/sync-standalone.sh --check-source

  standalone-typecheck:
    name: Typecheck travel-buddy-standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install standalone dependencies
        working-directory: travel-buddy-standalone
        run: pnpm install --frozen-lockfile

      - name: Typecheck standalone
        working-directory: travel-buddy-standalone
        run: pnpm typecheck
