name: Standalone dependency sync check

on:
  push:
    branches: ["**"]
    paths:
      - "artifacts/travel-buddy/package.json"
      - "travel-buddy-standalone/package.json"
      - "scripts/sync-standalone.sh"
      - "pnpm-workspace.yaml"
      - "artifacts/travel-buddy/tsconfig.json"
      - "travel-buddy-standalone/tsconfig.json"
      - "artifacts/travel-buddy/babel.config.js"
      - "travel-buddy-standalone/babel.config.js"
      - "artifacts/travel-buddy/metro.config.js"
      - "travel-buddy-standalone/metro.config.js"
      - "artifacts/travel-buddy/app.json"
      - "travel-buddy-standalone/app.json"
      - "artifacts/travel-buddy/.env.example"
      - "travel-buddy-standalone/.env.example"
      - "travel-buddy-standalone/**/*.ts"
      - "travel-buddy-standalone/**/*.tsx"
      - "artifacts/travel-buddy/**/*.ts"
      - "artifacts/travel-buddy/**/*.tsx"
      - "artifacts/travel-buddy/src/**"
      - "travel-buddy-standalone/src/**"
      - "artifacts/travel-buddy/app/**"
      - "travel-buddy-standalone/app/**"
      - "artifacts/travel-buddy/assets/**"
      - "travel-buddy-standalone/assets/**"
      - "artifacts/travel-buddy/components/**"
      - "travel-buddy-standalone/components/**"
      - "artifacts/travel-buddy/constants/**"
      - "travel-buddy-standalone/constants/**"
      - "artifacts/travel-buddy/hooks/**"
      - "travel-buddy-standalone/hooks/**"
      - "artifacts/travel-buddy/docs/**"
      - "travel-buddy-standalone/docs/**"
      - "artifacts/travel-buddy/migrations/**"
      - "travel-buddy-standalone/migrations/**"
      - "artifacts/travel-buddy/scripts/**"
      - "travel-buddy-standalone/scripts/**"
      - "artifacts/travel-buddy/server/**"
      - "travel-buddy-standalone/server/**"
      - "scripts/sync-standalone.sh"
      - "scripts/src/sync-standalone-check.test.ts"
      - ".github/workflows/sync-standalone-check.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "artifacts/travel-buddy/package.json"
      - "travel-buddy-standalone/package.json"
      - "scripts/sync-standalone.sh"
      - "pnpm-workspace.yaml"
      - "artifacts/travel-buddy/tsconfig.json"
      - "travel-buddy-standalone/tsconfig.json"
      - "artifacts/travel-buddy/babel.config.js"
      - "travel-buddy-standalone/babel.config.js"
      - "artifacts/travel-buddy/metro.config.js"
      - "travel-buddy-standalone/metro.config.js"
      - "artifacts/travel-buddy/app.json"
      - "travel-buddy-standalone/app.json"
      - "artifacts/travel-buddy/.env.example"
      - "travel-buddy-standalone/.env.example"
      - "travel-buddy-standalone/**/*.ts"
      - "travel-buddy-standalone/**/*.tsx"
      - "artifacts/travel-buddy/**/*.ts"
      - "artifacts/travel-buddy/**/*.tsx"
      - "artifacts/travel-buddy/src/**"
      - "travel-buddy-standalone/src/**"
      - "artifacts/travel-buddy/app/**"
      - "travel-buddy-standalone/app/**"
      - "artifacts/travel-buddy/assets/**"
      - "travel-buddy-standalone/assets/**"
      - "artifacts/travel-buddy/components/**"
      - "travel-buddy-standalone/components/**"
      - "artifacts/travel-buddy/constants/**"
      - "travel-buddy-standalone/constants/**"
      - "artifacts/travel-buddy/hooks/**"
      - "travel-buddy-standalone/hooks/**"
      - "artifacts/travel-buddy/docs/**"
      - "travel-buddy-standalone/docs/**"
      - "artifacts/travel-buddy/migrations/**"
      - "travel-buddy-standalone/migrations/**"
      - "artifacts/travel-buddy/scripts/**"
      - "travel-buddy-standalone/scripts/**"
      - "artifacts/travel-buddy/server/**"
      - "travel-buddy-standalone/server/**"
      - "scripts/sync-standalone.sh"
      - "scripts/src/sync-standalone-check.test.ts"
      - ".github/workflows/sync-standalone-check.yml"

jobs:
  sync-standalone-check:
    name: Check standalone dep/config sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Check standalone dependency and config sync
        run: bash scripts/sync-standalone.sh --dry-run

  source-drift-check:
    name: Check standalone source sync (src/ app/ assets/ components/ constants/ hooks/ docs/ migrations/ scripts/ server/)
    runs-on: ubuntu-latest
    env:
      # Set to a positive integer to allow a temporary grace margin during a
      # large-batch sync. Default is 0 — any divergence fails the build.
      SOURCE_DRIFT_THRESHOLD: 0
      # Override SOURCE_DRIFT_DIRS here to restrict or expand the checked set.
      # Default (when unset): "src app assets components constants hooks docs migrations scripts server"
    steps:
      - uses: actions/checkout@v4

      - name: Diff source directories
        run: bash scripts/sync-standalone.sh --check-source

  drift-check-tests:
    name: Run sync-standalone drift-check unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run drift-check tests
        run: pnpm --filter @workspace/scripts run test:sync-check

  standalone-typecheck:
    name: Typecheck travel-buddy-standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install standalone dependencies
        working-directory: travel-buddy-standalone
        run: pnpm install --frozen-lockfile

      - name: Typecheck standalone
        working-directory: travel-buddy-standalone
        run: pnpm typecheck
