name: Standalone dependency sync check

on:
  push:
    branches: ["**"]
    paths:
      - "artifacts/travel-buddy/package.json"
      - "travel-buddy-standalone/package.json"
      - "scripts/sync-standalone.sh"
      - "pnpm-workspace.yaml"
      - "artifacts/travel-buddy/tsconfig.json"
      - "travel-buddy-standalone/tsconfig.json"
  pull_request:
    branches: ["**"]
    paths:
      - "artifacts/travel-buddy/package.json"
      - "travel-buddy-standalone/package.json"
      - "scripts/sync-standalone.sh"
      - "pnpm-workspace.yaml"
      - "artifacts/travel-buddy/tsconfig.json"
      - "travel-buddy-standalone/tsconfig.json"

jobs:
  sync-standalone-check:
    name: Check standalone dep sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Check standalone dependency sync
        run: bash scripts/sync-standalone.sh --dry-run
