name: Pre-release checks

# Run the full pre-release validation suite on every push/PR to main or
# release branches. Failures block the build with a clear summary in the log.
#
# CONVENTION: always keep `.github/workflows/pre-release.yml` in every `paths`
# list below. Without it, editing this file alone would not re-trigger the
# workflow, silently skipping the new logic on the very commit that introduced it.

on:
  push:
    branches:
      - main
      - "release/**"
      - "release-*"
  pull_request:
    branches:
      - main
      - "release/**"
      - "release-*"

jobs:
  pre-release-checks:
    name: Pre-release checks (typecheck + drift)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Install standalone dependencies
        working-directory: travel-buddy-standalone
        run: pnpm install --frozen-lockfile

      - name: Test pre-release fix hints
        run: bash scripts/test-pre-release-hints.sh

      - name: Test bundle-ID placeholder guard
        run: bash scripts/test-bundle-id-guard.sh

      - name: Run pre-release checks
        env:
          SKIP_EAS_PREFLIGHT: "1"
        run: bash scripts/pre-release-check.sh

  eas-build:
    name: EAS preview build (Android + iOS)
    runs-on: ubuntu-latest
    # Only run on direct pushes to release branches (release/** or release-*),
    # not on pushes to main and not on PRs, to keep CI fast and avoid burning
    # EAS build credits on every review cycle.
    if: >
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/heads/release/') ||
       startsWith(github.ref, 'refs/heads/release-'))

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install eas-cli and expo-cli
        run: npm install -g eas-cli expo-cli

      - name: Install standalone dependencies
        working-directory: travel-buddy-standalone
        run: pnpm install --frozen-lockfile

      - name: Verify EXPO_TOKEN is configured
        # EXPO_TOKEN must be stored in GitHub → Settings → Secrets and variables → Actions.
        # Without it every eas build call below will fail with an auth error.
        # Fail here with a clear message rather than mid-build.
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it in GitHub → Settings → Secrets and variables → Actions, then re-run this workflow. See docs/eas-runbook.md → 'iOS credentials setup for CI' for full instructions."
            exit 1
          fi

      - name: Run EAS/expo preflight (pre-release checks without SKIP_EAS_PREFLIGHT)
        working-directory: travel-buddy-standalone
        run: |
          eas --version
          expo --version

      - name: Check iOS EAS credentials are present and not near-expiry
        # Fails fast with a clear message if the Apple Distribution Certificate or
        # Provisioning Profile stored in EAS cloud are missing, already expired, or
        # expiring within 30 days — before burning EAS build credits on a doomed run.
        # To rotate credentials: run `eas credentials --platform ios` locally and
        # follow the prompts. See docs/eas-runbook.md → 'Rotating iOS credentials'.
        working-directory: travel-buddy-standalone
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set +e
          eas credentials --platform ios --non-interactive --json \
            > /tmp/ios-creds.json 2>/tmp/ios-creds-err.txt
          EAS_EXIT=$?
          set -e

          if [ $EAS_EXIT -ne 0 ]; then
            echo "::error::EAS credential check failed — could not retrieve iOS credentials from EAS cloud. Ensure 'eas credentials --platform ios' has been run at least once and that EXPO_TOKEN has access to this project. See docs/eas-runbook.md → 'iOS credentials setup for CI' and 'Rotating iOS credentials'."
            cat /tmp/ios-creds-err.txt || true
            exit 1
          fi

          node << 'NODESCRIPT'
          const fs = require('fs');

          let creds;
          try {
            const raw = fs.readFileSync('/tmp/ios-creds.json', 'utf8').trim();
            creds = JSON.parse(raw);
          } catch (e) {
            console.log('::error::EAS credential check failed — could not parse JSON output from eas credentials. Raw output may be empty or malformed. Run eas credentials --platform ios locally to diagnose. See docs/eas-runbook.md → "Rotating iOS credentials".');
            process.exit(1);
          }

          const WARN_DAYS = 30;
          const now = Date.now();
          const msPerDay = 86400_000;
          let failed = false;

          // Walk the credential object and collect all expiry-like date values.
          // EAS CLI JSON shape has changed across versions; field names seen in the
          // wild include: validityNotAfter, expirationTime, expiresAt, expires,
          // provisioningProfileExpirationTime. Scan all string values that look like
          // ISO dates and are keyed with "expir" or "notafter" (case-insensitive).
          function findExpiries(obj, path) {
            if (!obj || typeof obj !== 'object') return;
            for (const [k, v] of Object.entries(obj)) {
              const kl = k.toLowerCase();
              if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}/.test(v) &&
                  (kl.includes('expir') || kl.includes('notafter') || kl.includes('validity'))) {
                const ts = Date.parse(v);
                if (isNaN(ts)) return;
                const daysLeft = (ts - now) / msPerDay;
                const loc = `${path}.${k}`;
                if (daysLeft <= 0) {
                  console.log(`::error::iOS credential EXPIRED: ${loc} expired ${Math.abs(Math.floor(daysLeft))} day(s) ago (${v}). Run 'eas credentials --platform ios' locally to rotate. See docs/eas-runbook.md → "Rotating iOS credentials".`);
                  failed = true;
                } else if (daysLeft <= WARN_DAYS) {
                  console.log(`::error::iOS credential expiring soon: ${loc} expires in ${Math.floor(daysLeft)} day(s) (${v}). Rotate now to avoid a broken release build. Run 'eas credentials --platform ios' locally. See docs/eas-runbook.md → "Rotating iOS credentials".`);
                  failed = true;
                } else {
                  console.log(`iOS credential OK: ${loc} — ${Math.floor(daysLeft)} day(s) remaining (expires ${v})`);
                }
              } else if (typeof v === 'object') {
                findExpiries(v, `${path}.${k}`);
              }
            }
          }

          // Check distribution certificate presence.
          const hasCert = creds.iosDistributionCertificate ||
                          creds.distributionCertificate ||
                          creds.distCert ||
                          (Array.isArray(creds) && creds.length > 0);
          if (!hasCert && typeof creds === 'object' && !Array.isArray(creds) &&
              Object.keys(creds).length === 0) {
            console.log('::error::No iOS credentials found in EAS cloud. Run "eas credentials --platform ios" locally to create a Distribution Certificate and Provisioning Profile. See docs/eas-runbook.md → "iOS credentials setup for CI".');
            process.exit(1);
          }

          findExpiries(creds, 'ios');

          if (failed) {
            process.exit(1);
          }

          console.log('iOS EAS credential check passed.');
          NODESCRIPT

      - name: Trigger EAS Android preview build
        working-directory: travel-buddy-standalone
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # --non-interactive  suppress interactive prompts (required in CI)
        # (no --no-wait)     CI waits for the cloud build to finish and exits
        #                    non-zero if the build fails, so build breakage is
        #                    caught before a release is manually triggered.
        run: >
          eas build
          --platform android
          --profile preview
          --non-interactive

      - name: Trigger EAS iOS preview build
        working-directory: travel-buddy-standalone
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # --non-interactive  suppress interactive prompts (required in CI)
        # (no --no-wait)     CI waits for the cloud build to finish and exits
        #                    non-zero if the build fails, so a broken iOS build
        #                    blocks the release branch the same way Android does.
        run: >
          eas build
          --platform ios
          --profile preview
          --non-interactive
