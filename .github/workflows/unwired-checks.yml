# unwired-checks.yml — checks that exist in this repo and are invoked by
# NOTHING. Credential-free only.
#
# READ THIS BEFORE JUDGING A RED RUN HERE.
#
# Every check in this file is real, committed, maintained code that no
# check:all, no .replit workflow, and no other script has ever invoked. Their
# current pass/fail status is UNKNOWN — they could not be executed while this
# workflow was written (no node_modules, no database). Some of them may be red
# on the first run.
#
# A red run here is a finding, not a CI bug. It is the same finding as
# check:migration-prefixes: a correct check, committed, failing on something
# real, while everyone saw green because nothing ran it.
#
# The two acceptable responses to a red step here are:
#   1. fix what it found, or
#   2. delete that specific step, in a PR, with a written justification.
# Discarding its exit code is not on the list, and the ci-self-check job in
# ci.yml will fail the build if anyone tries.
#
# HOW SCRIPTS ARE INVOKED HERE: never through pnpm's workspace-selector form.
# That form exits 0 when it matches nothing (pnpm 10.26.1: an unmatched selector
# prints "No projects matched the filters" and exits 0; a matched package with a
# missing script also exits 0), so a step written that way would report SUCCESS
# for a renamed package or a deleted script — which is the same green-by-absence
# this workflow exists to expose. Every invocation goes through
# .github/scripts/pnpm-run.sh, which asserts the directory, the package name and
# the script all exist before running anything, and the preflight job below
# re-asserts every one of them before any install.
#
# This is a SEPARATE workflow from ci.yml so that a day-one red here does not
# obscure the core signal. That separation is a bootstrapping measure with an
# expiry, not a permanent tier: once these are green, add the VERDICT job below
# — 'unwired · verdict (skipped or cancelled is not a pass)' — to the required
# status checks. Not 'root-workspace', not 'standalone', and not the workflow
# name: a required status check is a job, and a skipped job is scored as a
# successful one, which is the whole reason the verdict job exists.
# Until then it is honest about being new.
# See docs/ci/README.md § "unwired-checks.yml is on probation" and
# § "Where mechanical enforcement ends".
#
# DELIBERATELY NOT HERE:
#   * scripts/pre-release-check.sh — a 600-line aggregate of 12 checks that
#     nothing invokes, and whose own comments describe soft-skipping the
#     engagement-index and schema-audit checks to exit 0 when no token is
#     present. Reusing it in CI would import exactly the green-by-absence
#     behaviour this effort exists to remove. Its useful parts (audit:schema)
#     are invoked directly in live-db.yml instead.
#   * @workspace/scripts test:db-triggers and test:engagement-indexes — both
#     reference SUPABASE in their source, so they belong in the credential
#     tier, and their exit contracts were not read. Not wired blind.
#   * src/scripts/checkAdminGuard.ts and
#     src/scripts/check-media-bucket-privacy.ts — orphans with zero references
#     repo-wide, no package.json script, exit contracts unknown. Not wired
#     blind. Both are worth a human's attention.

name: Unwired checks (probation)

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unwired-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # Same fail-fast guard as ci.yml: every (package directory, package name,
  # script) triple named under .github/ must exist on disk before any job
  # spends time installing. No install, no network.
  preflight:
    name: preflight · every CI-invoked package script exists
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Assert every CI-invoked (package, script) pair exists
        shell: bash
        run: node .github/scripts/assert-ci-scripts.mjs

  root-workspace:
    name: unwired · root + api-server + scripts workspace
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: preflight
    # test:truncate-guard applies migration 0074's DDL to a real database and
    # asserts TRUNCATE saved_places actually raises. It targets a Replit-local
    # host ("helium") that does not exist on a runner, so CI supplies its own
    # postgres and points TRUNCATE_GUARD_DATABASE_URL at it below.
    #
    # A throwaway container, not the project database: the test creates and
    # drops its own schema, and must never be able to reach real data.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: truncate_guard_test
        ports:
          - 5432:5432
        # Without a healthcheck the job races the container and psql fails on
        # connection refused rather than on anything the test is about.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          echo "pnpm $(pnpm --version)"
          node --version

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          set -euo pipefail
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-root-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-root-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install (root workspace, frozen lockfile)
        id: install
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      # Every step below uses !cancelled() so all of them report, rather than
      # stopping at the first failure — the same accumulate-and-attribute shape
      # as run-all-checks.sh.

      # Root "typecheck" is `pnpm -r run typecheck` — i.e. it runs in whichever
      # workspace members happen to DEFINE a typecheck script, which is not the
      # same thing as "all of them".
      #
      # VERIFIED AGAINST SOURCE, and corrected from an earlier claim in this
      # file and in docs/ci/README.md that it covers "api-server + lib/* +
      # scripts". IT DOES NOT COVER lib/*. What it actually covers:
      #
      #     @workspace/api-server      artifacts/api-server
      #     @workspace/mockup-sandbox  artifacts/mockup-sandbox
      #     @workspace/scripts         scripts
      #     expo-openmls               packages/expo-openmls
      #
      # NOT covered, because none of them defines a typecheck script:
      #
      #     @workspace/api-client-react   lib/api-client-react
      #     @workspace/api-spec           lib/api-spec  (no tsconfig.json either)
      #     @workspace/api-zod            lib/api-zod
      #     @workspace/db                 lib/db
      #
      # lib/db and lib/api-zod are type-checked only indirectly, as project
      # references of artifacts/api-server's tsconfig.json. lib/api-client-react
      # is referenced by nothing and is type-checked by nothing.
      #
      # `pnpm -r run <script>` does NOT fail when fewer members match than you
      # assumed, so the membership above is asserted by name in
      # .github/scripts/assert-ci-scripts.mjs (preflight job) and the real,
      # current coverage is printed to that job's summary. If a member loses its
      # typecheck script, the preflight goes red instead of this step quietly
      # covering less.
      #
      # Also not covered: travel-buddy-standalone, a separate workspace root.
      # Invoked by nothing today; the .replit workflow typechecks only
      # api-server.
      - name: 'root: typecheck (recursive — api-server, mockup-sandbox, travel-buddy, scripts, expo-openmls)'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/pnpm-run.sh . travel-buddy-workspace typecheck

      # REMOVED: 'root: typecheck:libs' (`tsc --build`).
      #
      # It could only ever fail, and never for a reason a PR author could act
      # on. `tsc --build` with no argument resolves ./tsconfig.json, whose first
      # line is `"extends": "expo/tsconfig.base"` — and `expo` is not a
      # dependency of the ROOT workspace (root package.json devDependencies:
      # @types/node, eslint, eslint-plugin-react-hooks, typescript,
      # typescript-eslint, zod-validation-error). The extends cannot resolve, so
      # tsc aborts before typechecking anything. Shipping that step would have
      # meant a permanently red check that reports a tooling defect, and a
      # permanently red check is one discarded exit code away from being no
      # check at all — the exact decay this workflow exists to prevent.
      #
      # Two further facts, so nobody restores it by adding `expo` and assumes it
      # then does what its name says:
      #   * root tsconfig.json declares NO "references", so `tsc --build` there
      #     builds no lib/* project. The name "typecheck:libs" is wrong.
      #     lib/api-client-react, lib/api-zod and lib/db each have their own
      #     composite tsconfig.json, and none is referenced from the root.
      #   * root tsconfig.json's include is ["**/*.ts", "**/*.tsx", ...] with no
      #     exclude, so it would pull in every tree in the repo at once,
      #     including travel-buddy-standalone.
      #
      # Making it runnable means editing root package.json or tsconfig.json,
      # which this CI work is not permitted to do. It is recorded as a repo
      # defect in docs/ci/README.md instead of being shipped as a step that
      # cannot pass.

      # eslint 10 + typescript-eslint 8 + eslint-plugin-react-hooks 7 are all
      # root devDependencies and eslint.config.mjs exists — but `lint` is in no
      # check:all and no .replit workflow. This is the step most likely to be
      # red on day one, simply because nothing has ever run it.
      - name: 'root: lint (eslint over api-server, scripts, standalone app+src)'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/pnpm-run.sh . travel-buddy-workspace lint

      # "gate on react-hooks/rules-of-hooks in the canonical tree" — wired
      # nowhere.
      - name: 'root: check:hook-order'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/pnpm-run.sh . travel-buddy-workspace check:hook-order

      # Defined at artifacts/api-server/package.json and referenced by exactly
      # nothing else in the repo. No credentials, exits 1 on a finding.
      - name: 'api-server: check:api-prefix'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/pnpm-run.sh artifacts/api-server @workspace/api-server check:api-prefix

      # @workspace/scripts is a real workspace member with 9 node:test suites
      # and a contract check, and NO check:all. Only test:cross-tree-paths is
      # referenced anywhere (a .replit workflow). The rest have never run
      # automatically. The two DB-dependent ones are excluded — see the header.
      - name: 'scripts: typecheck'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/pnpm-run.sh scripts @workspace/scripts typecheck

      - name: 'scripts: test:cross-tree-paths'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/pnpm-run.sh scripts @workspace/scripts test:cross-tree-paths

      - name: 'scripts: test:routes-guard'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/pnpm-run.sh scripts @workspace/scripts test:routes-guard

      - name: 'scripts: test:workflow-paths'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/pnpm-run.sh scripts @workspace/scripts test:workflow-paths

      - name: 'scripts: test:truncate-guard'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        env:
          TRUNCATE_GUARD_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/truncate_guard_test
        run: bash .github/scripts/pnpm-run.sh scripts @workspace/scripts test:truncate-guard

      - name: 'scripts: test:fixture-guard'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/pnpm-run.sh scripts @workspace/scripts test:fixture-guard

      - name: 'scripts: test:dead-routes'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/pnpm-run.sh scripts @workspace/scripts test:dead-routes

      - name: 'scripts: check:rent-buddy-contract'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/pnpm-run.sh scripts @workspace/scripts check:rent-buddy-contract

  standalone:
    name: unwired · travel-buddy-standalone guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    # No job-level defaults.working-directory: the install steps set it
    # explicitly, and the check steps run from the repo root because
    # .github/scripts/pnpm-run.sh takes the package directory as an argument
    # and is what verifies that directory exists.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        shell: bash
        working-directory: travel-buddy-standalone
        run: |
          set -euo pipefail
          corepack enable
          echo "pnpm $(pnpm --version)"
          node --version

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        working-directory: travel-buddy-standalone
        run: |
          set -euo pipefail
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-standalone-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('travel-buddy-standalone/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-standalone-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install (standalone workspace, frozen lockfile)
        id: install
        shell: bash
        working-directory: travel-buddy-standalone
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      # THE ASYMMETRY IS GONE, AND THAT MAKES THESE TWO STEPS LOAD-BEARING.
      # Both guards below used to be chained into `typecheck` in the legacy
      # frozen tree (artifacts/travel-buddy) while the canonical tree's
      # typecheck had dropped them — so they ran in the tree nobody edited and
      # not in the tree everybody edits. That tree is archived (see the PR that
      # removed it), which removes the only other place either guard ran.
      # These two steps are now the ONLY thing invoking them anywhere. Deleting
      # a step here does not move a check, it deletes the check.
      #
      # check-close-then-navigate has a package.json script
      # ("lint:close-then-navigate") that nothing else calls.
      - name: 'standalone: lint:close-then-navigate'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/pnpm-run.sh travel-buddy-standalone travel-buddy-standalone lint:close-then-navigate

      # check-route-registry.mjs has NO package.json script at all in this tree
      # (the legacy tree has "lint:routes"), so it is completely unreachable.
      # Invoked directly here rather than by adding a script, because this work
      # is not permitted to modify package.json. Direct `node <file>` invocation
      # has none of the selector-form hazard: node exits non-zero with
      # "Cannot find module" if the path is wrong. The existence check is
      # explicit anyway, so a moved script fails with a message rather than a
      # module-resolution stack trace.
      # Was invoked by raw file path, with a hand-rolled existence check standing
      # in for the coverage a package script gets for free. It now has one
      # (`check:route-registry`), so it goes through pnpm-run.sh like every other
      # check and preflight's assert-ci-scripts.mjs asserts the (package, script)
      # pair exists — a moved or renamed file fails preflight loudly instead of
      # this step silently pointing at nothing.
      - name: 'standalone: check:route-registry'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/pnpm-run.sh travel-buddy-standalone travel-buddy-standalone check:route-registry

  # ───────────────────────────────────────────────────────────────────────────
  # THE VERDICT. Same reasoning as ci.yml's `ci-verdict` and live-db.yml's
  # `live-db-verdict`, and it applies here for the same mechanical reason:
  #
  # `root-workspace` and `standalone` both declare `needs: preflight`. A FAILED
  # preflight does not fail them — it SKIPS them. GitHub scores a skipped
  # required status check as SUCCESSFUL. Without this job, a broken preflight
  # leaves both jobs grey-and-satisfied, having run nothing.
  #
  # This workflow is on probation and is not in branch protection yet (see the
  # header). When it goes in, THIS is the check to require, and the other three
  # must NOT be: it is the only one whose success implies the other jobs
  # actually ran.
  #
  # Bracket notation for hyphenated job ids — `needs.root-workspace` parses as
  # a subtraction in the expression language, not as a job result.
  # ───────────────────────────────────────────────────────────────────────────
  unwired-verdict:
    name: unwired · verdict (skipped or cancelled is not a pass)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - preflight
      - root-workspace
      - standalone
    steps:
      - name: Every unwired-checks job must have run and succeeded
        shell: bash
        env:
          R_PREFLIGHT: ${{ needs.preflight.result }}
          R_ROOT: ${{ needs['root-workspace'].result }}
          R_STANDALONE: ${{ needs['standalone'].result }}
        run: |
          set -uo pipefail
          BAD=0
          {
            echo "### unwired-checks run verdict"
            echo ""
            echo "| job | result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for PAIR in \
            "preflight:$R_PREFLIGHT" \
            "root-workspace:$R_ROOT" \
            "standalone:$R_STANDALONE"
          do
            NAME="${PAIR%%:*}"
            RESULT="${PAIR#*:}"
            echo "| $NAME | ${RESULT:-unknown} |" >> "$GITHUB_STEP_SUMMARY"
            echo "$NAME: ${RESULT:-unknown}"
            if [ "$RESULT" != "success" ]; then
              echo "::error::Job '$NAME' reported '${RESULT:-unknown}', not 'success'. These checks were invoked by nothing before this workflow existed; a skipped job puts them back in exactly that state while rendering as a satisfied required check. If the result is 'skipped', look at 'preflight': when it fails, every job that needs it is skipped rather than failed."
              BAD=1
            fi
          done

          if [ "$BAD" -ne 0 ]; then
            {
              echo ""
              echo "> **This run did not execute the unwired checks.** At least one job did"
              echo "> not reach a successful conclusion. See the annotations above."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All unwired-checks jobs ran and succeeded."
