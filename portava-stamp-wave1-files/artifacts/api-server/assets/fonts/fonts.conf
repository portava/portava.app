<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Minimal fontconfig for stamp composition rendering (sharp/librsvg).
     Activated by lib/stamps/composition/rasterize.ts setting FONTCONFIG_PATH
     when the host has no usable fontconfig of its own. -->
<fontconfig>
  <dir prefix="default">.</dir>
  <cachedir prefix="default">.cache</cachedir>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="same"><string>Poppins</string></edit>
  </match>
</fontconfig>
