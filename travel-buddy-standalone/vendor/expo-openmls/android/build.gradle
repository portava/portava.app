plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

// Trigger Rust cross-compilation for Android targets before the Kotlin build.
//
// The EAS pre-install hook installs rustup with `--no-modify-path`, so
// ~/.cargo/bin is NOT on PATH by the time Gradle runs in a later build phase.
// Resolve cargo explicitly and put its bin dir on PATH for every invocation
// below, rather than trusting an inherited environment.
def cargoHome = System.getenv('CARGO_HOME') ?: "${System.getProperty('user.home')}/.cargo"
def cargoBinDir = new File(cargoHome, 'bin')
def cargoBinary = new File(cargoBinDir, 'cargo')
def cargoExecutable = cargoBinary.exists() ? cargoBinary.absolutePath : 'cargo'
def cargoPath = "${cargoBinDir.absolutePath}${File.pathSeparator}${System.getenv('PATH') ?: ''}"

// Rust target triple -> Android ABI directory name. These are not
// interchangeable spellings: cargo writes to target/<triple>/release/, while
// AGP packages from <jniLibs dir>/<abi>/.
def abiForTarget = [
  'aarch64-linux-android'  : 'arm64-v8a',
  'armv7-linux-androideabi': 'armeabi-v7a',
  'x86_64-linux-android'   : 'x86_64',
]
def SO_NAME = 'libexpo_openmls.so'

task buildRustAndroid {
  doLast {
    // Verify cargo actually runs before anything else.
    //
    // This block used to println "cargo not found — skipping Rust build" and
    // return. That is how you ship an app with no encryption in it: the Rust
    // is skipped, no .so is produced, Kotlin never sees the bindings, and the
    // build goes green. A missing Rust toolchain must fail the build here,
    // where the cause is one line of output, rather than surface as an
    // UnsatisfiedLinkError on a device or as a silently crypto-free APK.
    def probe = new ByteArrayOutputStream()
    def cargoOk = exec {
      commandLine cargoExecutable, '--version'
      environment 'PATH', cargoPath
      standardOutput = probe
      errorOutput = probe
      ignoreExitValue = true
    }.exitValue == 0

    if (!cargoOk) {
      throw new GradleException(
        "[expo-openmls] cargo is required to build this module and is not usable.\n" +
        "  tried:  ${cargoExecutable}\n" +
        "  PATH:   ${cargoPath}\n" +
        "  output: ${probe.toString().trim()}\n" +
        "Install Rust — scripts/eas-install-rust.sh on EAS workers, rustup locally.\n" +
        "This is deliberately fatal: skipping it produces an app with no E2EE."
      )
    }
    println "[expo-openmls] using ${cargoExecutable} — ${probe.toString().trim()}"

    def targets = [
      'aarch64-linux-android',
      'armv7-linux-androideabi',
      'x86_64-linux-android',
    ]

    // Android NDK linkers for cargo. Rust ships the std for these targets but
    // has no idea how to LINK them: with nothing configured it falls back to
    // the host `cc`, which cannot produce Android objects.
    //
    // Deliberately not a .cargo/config.toml — that file cannot express this.
    // The NDK path differs per machine and per CI image and TOML has no
    // environment interpolation, so a config.toml would hardcode an absolute
    // path that is wrong everywhere except where it was written. AGP already
    // resolves the NDK it is going to use; derive from that.
    def ndkDir = android.ndkDirectory
    if (ndkDir == null || !ndkDir.exists()) {
      throw new GradleException(
        "[expo-openmls] Android NDK not found; cargo cannot link Android targets.\n" +
        "  android.ndkDirectory = ${ndkDir}"
      )
    }
    def osName = System.getProperty('os.name').toLowerCase()
    def hostTag = osName.contains('mac') ? 'darwin-x86_64'
                : osName.contains('windows') ? 'windows-x86_64'
                : 'linux-x86_64'
    def ndkBin = new File(ndkDir, "toolchains/llvm/prebuilt/${hostTag}/bin")
    def apiLevel = android.defaultConfig.minSdk ?: 24
    // NB the armv7 linker wrapper is spelled armv7a-, unlike its target triple.
    def clangFor = [
      'aarch64-linux-android'  : "aarch64-linux-android${apiLevel}-clang",
      'armv7-linux-androideabi': "armv7a-linux-androideabi${apiLevel}-clang",
      'x86_64-linux-android'   : "x86_64-linux-android${apiLevel}-clang",
    ]
    def llvmAr = new File(ndkBin, 'llvm-ar')

    targets.each { target ->
      def clang = new File(ndkBin, clangFor[target])
      if (!clang.exists()) {
        throw new GradleException(
          "[expo-openmls] NDK linker missing for ${target}\n" +
          "  expected: ${clang}\n" +
          "  NDK:      ${ndkDir}\n" +
          "Without it cargo falls back to the host cc and the link fails."
        )
      }

      println "[expo-openmls] cargo build --release --target ${target}"
      exec {
        workingDir '../'
        commandLine cargoExecutable, 'build', '--release', '--target', target
        environment 'PATH', cargoPath
        // Cargo reads CARGO_TARGET_<TRIPLE>_LINKER with the triple uppercased
        // and hyphens replaced by underscores. CC_/AR_ are for any cc-rs
        // build script in the dependency tree.
        environment "CARGO_TARGET_${target.toUpperCase().replace('-', '_')}_LINKER", clang.absolutePath
        environment "CC_${target}", clang.absolutePath
        environment "AR_${target}", llvmAr.absolutePath
      }

      // Stage the .so under an ABI-named directory. AGP reads jniLibs.srcDirs
      // as <dir>/<abi>/lib*.so — pointing it straight at cargo's output dir
      // means it looks for target/<triple>/release/arm64-v8a/*.so, finds
      // nothing, and packages nothing. Silently.
      def abi = abiForTarget[target]
      def produced = file("../target/${target}/release/${SO_NAME}")
      if (!produced.exists()) {
        throw new GradleException(
          "[expo-openmls] cargo reported success but produced no ${SO_NAME} for ${target}\n" +
          "  expected: ${produced}\n" +
          "Refusing to continue: this would package an APK with no native library."
        )
      }
      def destDir = file("${buildDir}/rustJniLibs/${abi}")
      destDir.mkdirs()
      copy {
        from produced
        into destDir
      }
      println "[expo-openmls] staged ${abi}/${SO_NAME} (${produced.length()} bytes)"
    }

    // Generate the Kotlin bindings. THIS STEP DID NOT EXIST: the Rust was
    // cross-compiled but uniffi-bindgen was never run, so uniffi/openmls/*.kt
    // was never produced and ExpoOpenmlsModule.kt had nothing to import.
    println "[expo-openmls] uniffi-bindgen: generating Kotlin bindings"
    exec {
      workingDir '../'
      commandLine cargoExecutable, 'run', '--quiet', '--bin', 'uniffi-bindgen', '--',
                  'generate', 'src/openmls.udl',
                  '--language', 'kotlin',
                  '--out-dir', 'android/src/main/java'
      environment 'PATH', cargoPath
    }
  }
}

// Nothing depended on buildRustAndroid, so Gradle never scheduled it. The task
// existed, looked like the Rust build was wired, and ran zero times in the
// cloud — `cargo build` appears nowhere in the EAS build log. Declaring a task
// is not running it.
afterEvaluate {
  tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn buildRustAndroid
  }
}

android {
  namespace "expo.modules.openmls"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }

  sourceSets {
    main {
      // Rust-built JNI libraries, staged into ABI-named subdirectories by
      // buildRustAndroid. This must be the staging root, NOT cargo's output
      // directory: AGP resolves jniLibs.srcDirs as <dir>/<abi>/lib*.so.
      jniLibs.srcDirs = ["${buildDir}/rustJniLibs"]
    }
  }
}

