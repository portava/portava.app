plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'com.portava.input'
version = '1.0.0'
android {
  namespace 'com.portava.input.speech'
  defaultConfig { versionCode 1; versionName '1.0.0'; minSdkVersion 24; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
}
dependencies {
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
