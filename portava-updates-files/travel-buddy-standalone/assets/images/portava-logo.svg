<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Tile background -->
    <linearGradient id="tileGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16223f"/>
      <stop offset="0.55" stop-color="#0e1730"/>
      <stop offset="1" stop-color="#0a1023"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#1e3a5f" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#14213f" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0a1023" stop-opacity="0"/>
    </radialGradient>
    <!-- Orange bowl gradient -->
    <linearGradient id="bowlGrad" x1="0" y1="0" x2="1" y2="0.85">
      <stop offset="0" stop-color="#ff5d55"/>
      <stop offset="0.5" stop-color="#ff7f3f"/>
      <stop offset="1" stop-color="#ffa62b"/>
    </linearGradient>
    <!-- Teal stem gradient -->
    <linearGradient id="stemGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#40e8cc"/>
      <stop offset="1" stop-color="#14b8a8"/>
    </linearGradient>
    <!-- Arrow gradients (two facets for paper-plane depth) -->
    <linearGradient id="arrowLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ff2dd"/>
      <stop offset="1" stop-color="#2bd9c0"/>
    </linearGradient>
    <linearGradient id="arrowDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fc4ae"/>
      <stop offset="1" stop-color="#0e9487"/>
    </linearGradient>
    <!-- Wordmark AVA gradient -->
    <linearGradient id="avaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4aeccf"/>
      <stop offset="1" stop-color="#1cc8b2"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="tinyShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#03352e" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="30" y="30" width="1140" height="1140" rx="190"/>
    </clipPath>
  </defs>

  <!-- page backdrop -->
  <rect width="1200" height="1200" fill="#060b16"/>

  <!-- tile -->
  <g>
    <rect x="30" y="30" width="1140" height="1140" rx="190" fill="url(#tileGrad)"/>
    <rect x="30" y="30" width="1140" height="1140" rx="190" fill="url(#glow)"/>
    <rect x="31.5" y="31.5" width="1137" height="1137" rx="188.5" fill="none" stroke="#3a4d78" stroke-opacity="0.35" stroke-width="3"/>
  </g>

  <!-- decorative route arcs -->
  <g clip-path="url(#tileClip)" fill="none" stroke-linecap="round">
    <path d="M 120,820 C 340,560 720,900 1080,520" stroke="#3ee6c9" stroke-opacity="0.16" stroke-width="4.5" stroke-dasharray="2 24"/>
    <path d="M 90,420 C 320,220 620,140 1110,260" stroke="#ffffff" stroke-opacity="0.11" stroke-width="4.5" stroke-dasharray="2 24"/>
    <path d="M 220,1090 C 480,980 830,1120 1090,940" stroke="#ff8a3f" stroke-opacity="0.13" stroke-width="4.5" stroke-dasharray="2 24"/>
    <g fill="#3ee6c9" stroke="none">
      <circle cx="120" cy="820" r="7" fill-opacity="0.22"/>
      <circle cx="1080" cy="520" r="7" fill-opacity="0.22"/>
    </g>
    <g fill="#ffffff" stroke="none">
      <circle cx="90" cy="420" r="6" fill-opacity="0.14"/>
      <circle cx="1110" cy="260" r="6" fill-opacity="0.14"/>
    </g>
    <g fill="#ff8a3f" stroke="none">
      <circle cx="220" cy="1090" r="6" fill-opacity="0.16"/>
      <circle cx="1090" cy="940" r="6" fill-opacity="0.16"/>
    </g>
  </g>

  <!-- ============ THE MARK ============ -->
  <g transform="translate(-24,4)">
    <!-- Orange bowl of the P with speech-bubble tail -->
    <path filter="url(#softShadow)" fill="url(#bowlGrad)" d="
      M 572,170
      L 640,170
      A 260,260 0 1 1 595,686
      C 572,744 550,770 529,788
      C 533,728 549,622 565,536
      A 130,130 0 1 0 640,300
      L 572,300
      A 65,65 0 0 1 572,170
      Z"/>

    <!-- Teal stem with angled bottom -->
    <path filter="url(#softShadow)" fill="url(#stemGrad)" d="
      M 366,222.5
      A 52.5,52.5 0 0 1 471,222.5
      L 471,730
      L 378,812
      A 22,22 0 0 1 366,795
      Z"/>

    <!-- Navigation arrow (paper plane, two facets) -->
    <g filter="url(#tinyShadow)">
      <path fill="url(#arrowLight)" d="M 715,361 L 545.5,431.5 L 627,450 Z"/>
      <path fill="url(#arrowDark)"  d="M 715,361 L 627,450 L 644.5,530.5 Z"/>
    </g>
  </g>

