kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
# Handles ALL paths: /api/* goes to the Express API router; everything else
# falls through to the travel-buddy-standalone frontend catch-all middleware.
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
# Builds both the API server (esbuild) and the frontend (Metro OTA bundles).
# scripts/build-production.sh runs both steps sequentially with set -e.
args = ["bash", "scripts/build-production.sh"]

[services.production.build.env]
NODE_ENV = "production"
COREPACK_HOME = "/tmp/corepack"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
