kind = "mobile"
previewPath = "/"
title = "Travel Buddy"
version = "1.0.0"
id = "artifacts/travel-buddy"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20682

[services.development]
# 2026-08-06 consolidation: travel-buddy-standalone/ is the canonical mobile
# tree (see replit.md SOURCE OF TRUTH banner). This artifact's dev service now
# builds/serves straight from that directory instead of the legacy-frozen
# artifacts/travel-buddy tree — the legacy tree is no longer runnable via any
# artifact-managed workflow. The dev service's cwd is this artifact's own
# directory (artifacts/travel-buddy), so we go up two levels to reach the repo
# root before descending into the standalone tree. `pnpm run dev` (not a bare
# `bash scripts/...`) so pnpm puts the standalone tree's own node_modules/.bin
# (its local `expo` binary) on PATH — it is not a workspace package, so a
# bare exec can't find `expo` otherwise.
run = "cd ../../travel-buddy-standalone && pnpm run dev"

[services.production]

[services.production.build]
args = ["node", "travel-buddy-standalone/scripts/build.js"]

[services.production.run]
args = ["node", "travel-buddy-standalone/server/serve.js"]

[services.production.run.env]
PORT = "20682"
BASE_PATH = "/"

[services.env]
PORT = "20682"
BASE_PATH = "/"
