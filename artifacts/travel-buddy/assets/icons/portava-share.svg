  place / moment / post along to someone else. Not a stock icon-library glyph.

  Single compound path, fill="currentColor", 24x24 viewBox. Keep this file and
  PortavaShareIcon.tsx / PortavaShareIcon.web.tsx in sync — do not duplicate
  the path data elsewhere.
